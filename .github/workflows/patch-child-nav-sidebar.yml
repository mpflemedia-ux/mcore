name: patch-child-nav-sidebar
on:
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch sync JS + bump cache bust
        run: python3 scripts/patch_child_nav_sidebar.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/role-permissions-sync.js app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore: child nav Expense+Achievements + sync cache bust v6"
          git push origin HEAD:main
