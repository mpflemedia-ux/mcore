name: sidebar-lang-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sidebar-lang-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump nav-mobile.js + notif-page.js to v=2 (blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./nav-mobile.js?v=2"' "$F"; then echo already; exit 0; fi
          test "$(git hash-object "$F")" = "0d4cae0bec7ce8097ec9555b95bd08098d715d40"
          for d in app build/app; do test "$(git hash-object $d/nav-mobile.js)" = "8b4bbfbc8c5ad1203ce82b8257a86f377a3f734b"; test "$(git hash-object $d/notif-page.js)" = "8bfe0a63784eb1e7294a4fc48c1240d8b21032ed"; done
          sed -e 's#src="./nav-mobile.js?v=1"#src="./nav-mobile.js?v=2"#' -e 's#src="./notif-page.js?v=1"#src="./notif-page.js?v=2"#' "$F" > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "487fc937309a66b5fd476114eaaed6a719e255e2"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix: bump nav-mobile.js + notif-page.js to v=2 (EN/BM labels)"
          git push
