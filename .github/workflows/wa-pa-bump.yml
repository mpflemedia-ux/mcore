name: wa-pa-bump-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wa-pa-bump.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'wa-doc2-core.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "3463d40d39124da4df6d6770b61b77598b5d41cd"
          test "$(git hash-object app/wa-doc-core.js)" = "9059501922319d1044f7e0bf547a5367fe5b637b"
          test "$(git hash-object app/wa-doc2-core.js)" = "c760e8da9a41928776d2a2c4c23053b9fb4d6435"
          for n in wa-doc-core wa-doc2-core; do test "$(git hash-object app/$n.js)" = "$(git hash-object build/app/$n.js)"; done
          sed -i 's#wa-doc-core.js?v=1#wa-doc-core.js?v=2#;s#wa-doc2-core.js?v=1#wa-doc2-core.js?v=2#' "$F"
          test "$(git hash-object "$F")" = "f132fb3ed2a9204a9395eb14555f6fa6cd6512d5"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "feat(wa-doc): bump wa-doc-core v2, wa-doc2-core v2 (PA full access)"
          git push
