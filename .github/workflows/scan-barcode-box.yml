name: scan barcode box
on:
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Widen barcode box
        run: |
          python3 - << 'PY'
          import base64
          from pathlib import Path
          p = Path('app/index.html')
          text = p.read_text()
          old = base64.b64decode('ICBfc2Nhbm5lckh0bWw1UXJjb2RlID0gbmV3IEh0bWw1UXJjb2RlKCdzY2FubmVyLXJlZ2lvbicpCiAgX3NjYW5uZXJIdG1sNVFyY29kZS5zdGFydCgKICAgIHsgZmFjaW5nTW9kZTogJ2Vudmlyb25tZW50JyB9LAogICAgeyBmcHM6IDEwLCBxcmJveDogMjIwIH0sCg==').decode()
          new = base64.b64decode('').decode()
          n = text.count(old)
          if n != 1:
              raise SystemExit('expected 1 scanner start, found %s' % n)
          text = text.replace(old, new, 1)
          if "qrbox: 220" in text:
              raise SystemExit('square box still present')
          if 'function openBarcodeScanner' not in text:
              raise SystemExit('scanner function missing')
          p.write_text(text)
          print('patched', len(text))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/scan-barcode-box.yml
          git commit -m "fix(scan): read product barcodes instead of a square QR box"
          git push origin HEAD:main
