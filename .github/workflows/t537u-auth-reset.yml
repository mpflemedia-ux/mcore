name: t537u-auth-reset
on:
  workflow_dispatch:
    inputs:
      email:
        description: Auth user email
        required: true
        type: string
        default: amirahsalwanismail@gmail.com
jobs:
  reset:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Admin reset via Management API + GoTrue
        id: reset
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EMAIL: ${{ inputs.email }}
          PROJECT_REF: wjqhhnjlgoigoagsnsen
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "missing SUPABASE_ACCESS_TOKEN secret" >&2
            exit 1
          fi
          python3 - <<'PY' > /tmp/amirah-temp-password.txt
          import secrets, string
          alphabet = string.ascii_letters + string.digits + "!@#$%^*-_"
          pw = "Am" + "".join(secrets.choice(alphabet) for _ in range(16)) + "9!"
          print(pw, end="")
          PY
          chmod 600 /tmp/amirah-temp-password.txt
          curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys" > /tmp/keys.json
          SR=$(python3 - <<'PY'
          import json
          keys=json.load(open("/tmp/keys.json"))
          if isinstance(keys, dict) and keys.get("message"):
            raise SystemExit("mgmt_error:"+str(keys.get("message")))
          for k in keys:
            name=(k.get("name") or "").lower()
            typ=(k.get("type") or "").lower()
            if name=="service_role" or typ=="service_role" or "service_role" in name:
              print(k.get("api_key") or k.get("key") or "")
              break
          PY
          )
          if [ -z "$SR" ]; then
            echo "could not resolve service_role" >&2
            python3 -c "import json; k=json.load(open("/tmp/keys.json")); print(type(k).__name__, (list(k[0].keys()) if isinstance(k,list) and k else k))" >&2
            exit 1
          fi
          BASE="https://${PROJECT_REF}.supabase.co"
          curl -sS -H "apikey: $SR" -H "Authorization: Bearer $SR" \
            "$BASE/auth/v1/admin/users?page=1&per_page=200" > /tmp/users.json
          UID=$(python3 - <<'PY'
          import json,os
          email=os.environ["EMAIL"].lower()
          data=json.load(open("/tmp/users.json"))
          users=data.get("users") if isinstance(data,dict) else data
          for u in users or []:
            if (u.get("email") or "").lower()==email:
              print(u["id"]); break
          PY
          )
          if [ -z "$UID" ]; then
            echo "USER_NOT_FOUND:$EMAIL" >&2
            exit 2
          fi
          echo "USER_FOUND:$UID"
          echo "$UID" > /tmp/amirah-uid.txt
          BODY=$(python3 -c "import json; print(json.dumps({"password":open("/tmp/amirah-temp-password.txt").read()}))")
          CODE=$(curl -sS -o /tmp/upd.json -w "%{http_code}" -X PUT \
            -H "apikey: $SR" -H "Authorization: Bearer $SR" -H "Content-Type: application/json" \
            "$BASE/auth/v1/admin/users/$UID" -d "$BODY")
          echo "UPDATE_HTTP:$CODE"
          if [ "$CODE" != "200" ]; then
            head -c 400 /tmp/upd.json >&2; echo >&2
            exit 3
          fi
          echo "PASSWORD_SET_OK"
          echo "uid=$UID" >> "$GITHUB_OUTPUT"

      - name: Upload temp password artifact (Mike/agent only)
        uses: actions/upload-artifact@v4
        with:
          name: amirah-temp-password
          path: |
            /tmp/amirah-temp-password.txt
            /tmp/amirah-uid.txt
          retention-days: 1
