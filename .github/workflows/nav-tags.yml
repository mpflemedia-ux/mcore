name: nav-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-tags.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'nav-core.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "f2e9c93c3c642662289a3a3c954f3ddbafd42c38"
          for n in css core render keys mobile admin; do test "$(git hash-object app/nav-$n.js)" = "$(git hash-object build/app/nav-$n.js)"; done
          grep -q 'NV.wrapFn' app/nav-core.js
          python3 - <<'PY'
          src=open('app/index.html').read()
          needle='<script src="./notif-hooks.js?v=2"></script>'
          assert src.count(needle)==1
          tags='\n'.join('<script src="./nav-%s.js?v=1"></script>'%n for n in ['css','core','render','keys','mobile','admin'])
          open('/tmp/n.html','w').write(src.replace(needle,needle+'\n'+tags,1))
          PY
          test "$(git hash-object /tmp/n.html)" = "99b6cbff405fe94b0007f8bc3ff53b08d5663a5b"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sidebar: 6 nav-*.js tags"
          git push
