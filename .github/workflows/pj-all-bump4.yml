name: pj-all-bump4-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-all-bump4.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'pj-all-core.js?v=4' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "359246dc4e79ceb6799bf44b502896d90872d862"
          test "$(git hash-object app/pj-all-core.js)" = "476429836a6b1416fdc91b872e3ba831caac5046"
          test "$(git hash-object build/app/pj-all-core.js)" = "476429836a6b1416fdc91b872e3ba831caac5046"
          sed -i 's|./pj-all-core.js?v=3"|./pj-all-core.js?v=4"|' "$F"
          test "$(git hash-object "$F")" = "505cfa2b6654e4625ae0fbbff6098742b1c03df1"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(projects): pj-all-core v4 (open Projects on All projects)"
          git push
