name: pj-multi-index-tags-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-multi-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 5 pj-multi-*.js tags after pj-wa-board.js in app/index.html (additive, blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./pj-multi-core.js' "$F"; then echo "already present - no-op"; exit 0; fi
          test "$(git hash-object "$F")" = "e7020cb1158e11bb09c21fc5e02c035d84beb801"
          for n in css core ui daily remind; do test -f "app/pj-multi-$n.js"; test "$(git hash-object app/pj-multi-$n.js)" = "$(git hash-object build/app/pj-multi-$n.js)"; done
          A='<script src="./pj-wa-board.js?v=1"></script>'
          test "$(grep -cxF "$A" "$F")" = "1"
          T=$(mktemp)
          for n in css core ui daily remind; do echo "<script src=\"./pj-multi-$n.js?v=1\"></script>" >> "$T"; done
          awk -v a="$A" -v t="$T" '{print} $0==a{while((getline l < t)>0) print l}' "$F" > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "b492964456c1c84982ef7b8d7fb9410bb6bcf931"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "projects multi-assignee: 5 pj-multi-*.js tags in app/index.html (blob b492964)"
          git push
