name: pa-print-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pa-print-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump nav-css v=4 + pa-core v=2 (blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./pa-core.js?v=2"' "$F"; then echo already; exit 0; fi
          test "$(git hash-object "$F")" = "8e6762a8714db9037c436d5e43b34cd0957c3564"
          for d in app build/app; do test "$(git hash-object $d/nav-css.js)" = "bd5b5a86923824e803ecda0058974ca1368c2979"; test "$(git hash-object $d/pa-core.js)" = "a0a8e90ed465cec001dec83e28d24810ae6e4fb0"; done
          sed -e 's#src="./nav-css.js?v=3"#src="./nav-css.js?v=4"#' -e 's#src="./pa-core.js?v=1"#src="./pa-core.js?v=2"#' "$F" > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "b5d14a3c759f104b3536521d2485fafe14e9a4e7"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "fix: bump nav-css v=4 + pa-core v=2 (print hides PA/support bar)"
          git push
