name: bo-b-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bo-b-tags.yml']
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'bo-notes.js?v=' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "6089f15aad026b6fadb25871712853bd72cb0255"
          test "$(git hash-object app/pa-core.js)" = "97b060a096ad5cba3de0af78f900a56348f5d55f"
          test "$(git hash-object build/app/pa-core.js)" = "97b060a096ad5cba3de0af78f900a56348f5d55f"
          test "$(git hash-object app/bo-notes.js)" = "51669d9a9300bd65f1509b21fccdb28086690c34"
          test "$(git hash-object build/app/bo-notes.js)" = "51669d9a9300bd65f1509b21fccdb28086690c34"
          test "$(git hash-object app/bo-follow.js)" = "6769d5be25ce3cbba7afe97c350fbfc6b5266a0c"
          test "$(git hash-object build/app/bo-follow.js)" = "6769d5be25ce3cbba7afe97c350fbfc6b5266a0c"
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./bo-tenant.js?v=1"></script>\n'
          assert s.count(a)==1 and s.count('pa-core.js?v=3')==1
          s=s.replace(a,a+'<script src="./bo-notes.js?v=1"></script>\n<script src="./bo-follow.js?v=1"></script>\n').replace('pa-core.js?v=3','pa-core.js?v=4')
          open('app/index.html','w').write(s)
          PY
          test "$(git hash-object "$F")" = "42b6569b63f9fd52a99c21ec27f26214031c6305"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "feat(bo): Phase B script tags (bo-notes, bo-follow v1; pa-core v4)"
          git push
