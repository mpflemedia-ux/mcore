name: patch-sd-table-fit-scroll
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_sd_table_fit_v8.py
      - .github/workflows/patch-sd-table-fit-scroll.yml
      - app/sd-table-fit.js
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake sd-table-fit.js?v=8 into index.html
        run: python3 scripts/patch_sd_table_fit_v8.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(hr): bake sd-table-fit scroll-jump cache bust v=8 into index.html"
          git push
