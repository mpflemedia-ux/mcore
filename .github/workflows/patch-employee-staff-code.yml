name: patch-employee-staff-code
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Staff ID in app/index.html
        run: |
          python3 - << 'ENDPATCH'
          from pathlib import Path
          import sys
          p = Path('app/index.html')
          text = p.read_text(encoding='utf-8')
          old_form = '      <div class="form-group" style="grid-column:1/-1"><label class="form-label">${t.name}</label><input id="emp-name" class="form-input" value="${_aiEscapeHtml(src.name||\'\')}"></div>\n      <div class="form-group"><label class="form-label">${t.ic}</label><input id="emp-ic" class="form-input" placeholder="${t.icPh}" value="${src.ic_no||\'\'}"></div>\n'
          new_form = '      <div class="form-group" style="grid-column:1/-1"><label class="form-label">${t.name}</label><input id="emp-name" class="form-input" value="${_aiEscapeHtml(src.name||\'\')}"></div>\n      <div class="form-group" style="grid-column:1/-1"><label class="form-label">Staff ID</label><input id="emp-staff-code" class="form-input" value="${_aiEscapeHtml(src.staff_code||\'\')}"></div>\n      <div class="form-group"><label class="form-label">${t.ic}</label><input id="emp-ic" class="form-input" placeholder="${t.icPh}" value="${src.ic_no||\'\'}"></div>\n'
          old_save = "  if(ic && !validateIC(ic)) { showToast(isBm?'Format IC tidak sah (XXXXXX-XX-XXXX)':'Invalid IC format (XXXXXX-XX-XXXX)', 'error'); return }\n  const payload = {\n    tenant_id: APP.tenant.id,\n    name,\n    ic_no: ic || null,\n"
          new_save = "  if(ic && !validateIC(ic)) { showToast(isBm?'Format IC tidak sah (XXXXXX-XX-XXXX)':'Invalid IC format (XXXXXX-XX-XXXX)', 'error'); return }\n  // Staff ID: empty string stored as NULL. Generate only on insert when the box is empty.\n  let staffCode = String((document.getElementById('emp-staff-code')||{}).value||'').trim()\n  if(!id && !staffCode) {\n    let code = (APP.tenant && APP.tenant.code != null) ? String(APP.tenant.code).trim() : ''\n    let tname = (APP.tenant && APP.tenant.name != null) ? String(APP.tenant.name) : ''\n    if(!code && APP.tenant && APP.tenant.id) {\n      try {\n        const {data: trow} = await sb.from('tenants').select('code,name').eq('id', APP.tenant.id).maybeSingle()\n        if(trow) {\n          if(trow.code != null) code = String(trow.code).trim()\n          if(trow.name != null) tname = String(trow.name)\n        }\n      } catch(e) {}\n    }\n    let prefix = code\n    if(!prefix) prefix = String(tname||'').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 2)\n    if(!prefix) prefix = 'ST'\n    let maxN = 0\n    try {\n      const {data: codes} = await sb.from('employees').select('staff_code').eq('tenant_id', APP.tenant.id).limit(10000)\n      const esc = prefix.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')\n      const re = new RegExp('^' + esc + '-(\\\\d+)$', 'i')\n      ;(codes||[]).forEach(function(row){\n        const m = String(row && row.staff_code || '').trim().match(re)\n        if(m) { const n = parseInt(m[1], 10); if(n > maxN) maxN = n }\n      })\n    } catch(e) {}\n    staffCode = prefix + '-' + String(maxN + 1).padStart(4, '0')\n  }\n  const payload = {\n    tenant_id: APP.tenant.id,\n    name,\n    ic_no: ic || null,\n    staff_code: staffCode ? staffCode : null,\n"
          old_err = "    if(!error) showToast(APP.language==='bm'?'Disimpan tanpa PZB — run SQL migration zakat':'Saved without PZB — run zakat SQL migration','info')\n  }\n  if(error) { showToast('Error: '+error.message, 'error'); return }\n  if(!id && fromApplicantId) {\n"
          new_err = "    if(!error) showToast(APP.language==='bm'?'Disimpan tanpa PZB — run SQL migration zakat':'Saved without PZB — run zakat SQL migration','info')\n  }\n  if(error) {\n    const _scMsg = [error.code, error.message, error.details, error.hint].filter(Boolean).join(' ')\n    if((String(error.code)==='23505' || /duplicate key|unique constraint/i.test(_scMsg)) && /staff_code/i.test(_scMsg)) {\n      showToast('Staff ID already used', 'error'); return\n    }\n    showToast('Error: '+error.message, 'error'); return\n  }\n  if(!id && fromApplicantId) {\n"

          def apply(text, old, new, label):
              n = text.count(old)
              if n == 1:
                  print('patch', label)
                  return text.replace(old, new, 1), True
              if n == 0 and new in text:
                  print('already', label)
                  return text, False
              print('BAD', label, 'count', n)
              sys.exit(1)

          changed = False
          text, c = apply(text, old_form, new_form, 'form')
          changed = changed or c
          text, c = apply(text, old_save, new_save, 'save')
          changed = changed or c
          text, c = apply(text, old_err, new_err, 'err')
          changed = changed or c
          if changed:
              p.write_text(text, encoding='utf-8')
              print('wrote', p)
          else:
              print('no change')
          ENDPATCH
      - name: Commit index.html and remove this workflow
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/index.html
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "feat(hr): Staff ID on the employee form"
          fi
          git rm -f -- .github/workflows/patch-employee-staff-code.yml
          git commit -m "chore: remove one-shot Staff ID workflow"
          git push origin HEAD:main
