name: booking-pay-2-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/booking-pay-2.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'booking-pay-pub-css.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "31972536516997b0cd269bdf135d8a659dc033bb"
          test "$(git hash-object app/booking-pay-pub-css.js)" = "044a70d3c768a3276a3d90766d7d58ac0ebb6181"
          test "$(git hash-object .github/oneshot/bkpay2.py)" = "a16fa7558053db30094581af773cd694032fc1dd"
          python3 .github/oneshot/bkpay2.py "$F"
          test "$(git hash-object "$F")" = "23fad85090b4c2a539f36c055e294b31dd042957"
          git rm -q .github/oneshot/bkpay2.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(booking-pay): bump booking-pay-pub-css.js to v2 in app index.html"
          git push
