name: patch-pdoc-customer-lock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/pdoc-customer-lock.js
      - scripts/patch_pdoc_customer_lock.py
      - .github/workflows/patch-pdoc-customer-lock.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake pdoc-customer-lock V8 + bill-to harden into index.html
        run: python3 scripts/patch_pdoc_customer_lock.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html scripts/patch_invoice_customer.py || true
          git diff --cached --quiet && echo 'nothing' && exit 0
          git pull --rebase origin main || true
          git commit -m "fix(sales): bake pdoc-customer-lock v8 (stop duplicate bill-to address+phone)"
          git push
