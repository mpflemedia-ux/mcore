name: one-shot wa-doc2 tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wa-doc2-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard + patch app/index.html + app/public.html
        run: |
          set -e
          test "$(git hash-object app/index.html)" = "c0a07f030bfc0ba22318c444a77370dbe5f99643"
          test "$(git hash-object app/public.html)" = "0300eab661d35d2e6cbd5c7b93baad65a33c313b"
          for p in "app/wa-doc2-bulk.js 649a37030fa6c657bf9b4b108673c0938969905e" "app/wa-doc2-core.js 93e1e93ea20679168a4d50b0c6869ea7f2ff398e" "app/wa-doc2-hooks.js d55b5523fd61d5f59076162045602b81293f075b" "app/wa-doc2-public.js 1bc21df94d30db11d6b845c7ebe226d0a2f68417" "app/wa-doc2-tpl.js d13ea7b60f846cd993fb3f8198f9c538354218d4" "build/app/wa-doc2-bulk.js 649a37030fa6c657bf9b4b108673c0938969905e" "build/app/wa-doc2-core.js 93e1e93ea20679168a4d50b0c6869ea7f2ff398e" "build/app/wa-doc2-hooks.js d55b5523fd61d5f59076162045602b81293f075b" "build/app/wa-doc2-public.js 1bc21df94d30db11d6b845c7ebe226d0a2f68417" "build/app/wa-doc2-tpl.js d13ea7b60f846cd993fb3f8198f9c538354218d4"; do
            set -- $p; test "$(git hash-object "$1")" = "$2" || { echo "blob mismatch $1"; exit 1; }
          done
          python3 - <<'PY'
          import sys
          p='app/index.html';s=open(p,encoding='utf-8').read()
          a='<script src="./wa-doc-public.js?v=1"></script>\n</body>'; assert s.count(a)==1
          tags=''.join('<script src="./wa-doc2-%s.js?v=1"></script>\n'%f for f in ['core','tpl','bulk','hooks','public'])
          s=s.replace(a,'<script src="./wa-doc-public.js?v=1"></script>\n'+tags+'</body>')
          open(p,'w',encoding='utf-8',newline='').write(s)
          p='app/public.html';s=open(p,encoding='utf-8').read()
          a='<script src="./wa-doc-public.js?v=1"></script>\n</body>'; assert s.count(a)==1
          s=s.replace(a,'<script src="./wa-doc-public.js?v=1"></script>\n<script src="./wa-doc2-public.js?v=1"></script>\n</body>')
          open(p,'w',encoding='utf-8',newline='').write(s)
          PY
          test "$(git hash-object app/index.html)" = "e48bc2c8673b495b0448e419562b4e2918de32c4"
          test "$(git hash-object app/public.html)" = "2add9599c20fbfbb11ef0401ca2808b3fc74d6cf"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html app/public.html
          git commit -m "feat: WhatsApp doc share Phase 2 script tags (wa-doc2-*.js v1) in index.html + public.html"
          git push
