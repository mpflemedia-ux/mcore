name: nav-aichat-fix-tags-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nav-aichat-fix-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump nav-css.js to v=2 (blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./nav-css.js?v=2"' "$F"; then echo "already v=2 - no-op"; exit 0; fi
          test "$(git hash-object "$F")" = "fb52997d09cd3a403d59cac6489e38c73f84bdd4"
          test -f app/nav-css.js
          test "$(git hash-object app/nav-css.js)" = "$(git hash-object build/app/nav-css.js)"
          sed -e 's#src="./nav-css.js?v=1"#src="./nav-css.js?v=2"#' "$F" > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "0de9982683cbc011830d4dc06f2d60dd2adf82e2"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix: bump nav-css.js to v=2 (AI chat panel viewport fit)"
          git push
