name: patch-projects-filter-search
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-string patch to app/projects.js
        run: |
          cat > /tmp/apply.py <<'PYEOF'
          import sys
          p = 'app/projects.js'
          s = open(p, encoding='utf-8').read()
          A1 = "    window._pjOpenTask = '';\n    refresh();\n  };\n})();"
          B1 = "    window._pjOpenTask = '';\n    state.filter = ''; state.group = ''; state.assignee = '';\n    refresh();\n  };\n})();"
          A2 = "    if (q) q.oninput = function () { state.filter = q.value; paint(); q.focus(); };\n"
          B2 = "    if (q) q.oninput = function () { var had = document.activeElement === q; var pos = q.selectionStart; state.filter = q.value; paint(); var nq = document.getElementById('pj-q'); if (had && nq) { nq.focus(); nq.setSelectionRange(pos, pos); } };\n"
          for a, b in ((A1, B1), (A2, B2)):
              n = s.count(a)
              assert n == 1, ('anchor count', n, a)
              s = s.replace(a, b)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched')
          PYEOF
          python3 /tmp/apply.py
          node --check app/projects.js
          git diff --stat
      - name: Commit, remove workflow, push
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/projects.js
          git commit -m "fix(projects): reset filters on open and keep search focus"
          git rm -q .github/workflows/patch-projects-filter-search.yml
          git commit -m "chore: remove one-shot patch-projects-filter-search workflow"
          git pull --rebase origin main
          git push origin HEAD:main
