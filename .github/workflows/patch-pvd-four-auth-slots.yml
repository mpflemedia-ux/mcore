name: patch-pvd-four-auth-slots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_pvd_four_auth_slots.py
      - .github/workflows/patch-pvd-four-auth-slots.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bake PVD 4 auth slots into index.html
        run: python3 scripts/patch_pvd_four_auth_slots.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          if git diff --cached --quiet; then echo 'nothing'; exit 0; fi
          git commit -m "feat(pvd): bake 4 auth slots (Prepared/Checked/First/Second)"
          git pull --rebase origin main || true
          git push
