name: cob-index-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cob-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert onboarding tags (additive, verified)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./onboarding-core.js' "$F"; then echo "tags already present - no-op"; exit 0; fi
          test "$(git hash-object $F)" = "89e6725bcfcc4ec262ca5294ca595bf60a749ec1"
          A='<script src="./reco-delete-confirm.js?v=1"></script>'
          test "$(grep -cxF "$A" $F)" = "1"
          T=$(mktemp)
          for n in core css data tenant item fields upload admin-data admin patenant review-panel review master master-edit; do
            echo "<script src=\"./onboarding-$n.js?v=1\"></script>" >> "$T"
          done
          awk -v a="$A" -v t="$T" '{print} $0==a{while((getline l < t)>0) print l}' $F > /tmp/new.html
          test "$(diff $F /tmp/new.html | grep -c '^<' || true)" = "0"
          test "$(diff $F /tmp/new.html | grep -c '^>' || true)" = "14"
          test "$(git hash-object /tmp/new.html)" = "6e7515242d0f3586dd2c3eb37d0bffc9fef6d1fa"
          cp /tmp/new.html $F
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $F
          git commit -m "onboarding: add 14 script tags to app/index.html (additive, blob 6e75152)"
          git push
