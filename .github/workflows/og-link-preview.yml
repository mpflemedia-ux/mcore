name: og-link-preview
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Write JPEG and point the link preview at it
        run: |
          python3 - << 'PY'
          import base64, hashlib, subprocess
          from pathlib import Path
          src = Path('.github/workflows/og-link-preview.yml').read_text(encoding='utf-8')
          lines = src.splitlines()
          a = lines.index('# BEGIN_JPEG_B64')
          b = lines.index('# END_JPEG_B64')
          raw = base64.b64decode(''.join(line[2:].strip() for line in lines[a+1:b]), validate=True)
          expect = '2df887323bc87d9c566d02ed99479c2866a9c7a518ce8145f4070b196492c6a6'
          if raw[:3] != b'\xff\xd8\xff' or len(raw) != 10831 or hashlib.sha256(raw).hexdigest() != expect:
              raise SystemExit('refuse')
          Path('assets').mkdir(exist_ok=True)
          Path('assets/og.jpg').write_bytes(raw)
          root = Path('index.html')
          text = root.read_text(encoding='utf-8')
          og = '<meta property="og:image" content="https://mpflemedia.my/assets/icon-512.png">'
          tw = '<meta name="twitter:image" content="https://mpflemedia.my/assets/icon-512.png">'
          if text.count(og) != 1 or text.count(tw) != 1:
              raise SystemExit('meta count')
          text2 = text.replace(og, '<meta property="og:image" content="https://mpflemedia.my/assets/og.jpg">', 1)
          text2 = text2.replace(tw, '<meta name="twitter:image" content="https://mpflemedia.my/assets/og.jpg">', 1)
          if text2.count('icon-512.png') < 1:
              raise SystemExit('png logo removed')
          if text2.count('https://mpflemedia.my/assets/og.jpg') != 2:
              raise SystemExit('jpg count')
          # width/height if present
          text2 = text2.replace('<meta property="og:image:width" content="512">', '<meta property="og:image:width" content="400">')
          text2 = text2.replace('<meta property="og:image:height" content="512">', '<meta property="og:image:height" content="400">')
          if 'og:image:type' not in text2:
              text2 = text2.replace('<meta property="og:image" content="https://mpflemedia.my/assets/og.jpg">', '<meta property="og:image" content="https://mpflemedia.my/assets/og.jpg">\n<meta property="og:image:type" content="image/jpeg">', 1)
          if not text2.startswith('<!DOCTYPE html>'):
              raise SystemExit('doctype lost')
          root.write_text(text2, encoding='utf-8')
          subprocess.run(['git','config','user.name','github-actions[bot]'], check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git','add','assets/og.jpg','index.html'], check=True)
          subprocess.run(['git','rm','-f','.github/workflows/og-link-preview.yml'], check=True)
          subprocess.run(['git','commit','-m','fix(og): square jpeg link preview'], check=True)
          subprocess.run(['git','pull','--rebase','origin','main'], check=True)
          subprocess.run(['git','push','origin','HEAD:main'], check=True)
          print(subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip())
          PY
