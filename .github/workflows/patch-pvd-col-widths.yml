name: patch-pvd-col-widths
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_pvd_col_widths.py
      - .github/workflows/patch-pvd-col-widths.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Bake PVD col widths into index.html
        run: python3 scripts/patch_pvd_col_widths.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(pvd): bake content-biased thead col widths for print"
          git push
