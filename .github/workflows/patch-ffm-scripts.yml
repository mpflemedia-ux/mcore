name: patch-ffm-scripts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_ffm_scripts.py'
      - '.github/workflows/patch-ffm-scripts.yml'
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add FFM script tags
        run: python3 scripts/patch_ffm_scripts.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(ffm): load ffm-core/hub/do/po.js?v=1 (Flash Fulfillment connector)"
          git push origin HEAD:main
