name: patch-sales-plan-2b
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify phase 2b module files (exact blob SHAs) and parse
        run: |
          check() { test -s "app/$1.js" || { echo "missing app/$1.js"; exit 1; }; node --check "app/$1.js"; h=$(git hash-object "app/$1.js"); test "$h" = "$2" || { echo "sha mismatch app/$1.js $h != $2"; exit 1; }; }
          check sales-plan-calc ac9db062d7076523f15b1873096a6437cc1da4e1
          check sales-plan-data ac2bc008c630c465f50121237ff20114c494e695
          check sales-plan-overview c177e072a47463a5317903e6fa43d73715906316
          check sales-plan-weekly 0812c42e34ce2ef9a25a4edf9b68a32fcce20a38
          check sales-plan-weekly-save aab3e76b677182ce5d3d1589da52bb7ae6b995e2
          check sales-plan-miles 9e6544fcd6950fb3f13fcb3f3ab4ffcf88d0367c
          check sales-plan-miles-save 3a1dd2e48d3a54b39443a9bdb9c384b62a8894fc
          check sales-plan-css3 8afdbc156293cc5979ed58b34dac9842e79ed07c
          check sales-plan-detail cd506da8f78c48a000a34b69cc31fcad06e9e5df
          cp app/index.html /tmp/index.orig.html
      - name: Add 8 script tags after the sales-plan block and bump detail to v=2
        run: |
          cat > /tmp/apply.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          NEW = ['sales-plan-calc', 'sales-plan-data', 'sales-plan-overview', 'sales-plan-weekly', 'sales-plan-weekly-save', 'sales-plan-miles', 'sales-plan-miles-save', 'sales-plan-css3']
          ANCHOR = '<script src="./sales-plan-css2.js?v=1"></script>\n'
          D1 = '<script src="./sales-plan-detail.js?v=1"></script>\n'
          D2 = '<script src="./sales-plan-detail.js?v=2"></script>\n'
          if 'sales-plan-calc.js' in s:
              sys.exit('already patched')
          assert s.count(ANCHOR) == 1, ('anchor', s.count(ANCHOR))
          assert s.count(D1) == 1, ('detail', s.count(D1))
          s = s.replace(ANCHOR, ANCHOR + ''.join('<script src="./%s.js?v=1"></script>\n' % f for f in NEW))
          s = s.replace(D1, D2)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched OK')
          PYEOF
          python3 /tmp/apply.py app/index.html
          git diff --stat
          git diff
          test "$(git diff --numstat app/index.html | awk '{print $1" "$2}')" = "9 1"
          test "$(git diff -U0 app/index.html | grep '^[-+]<' | grep -vc 'sales-plan')" = "0"
      - name: Commit, remove workflow, push
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "feat(sales-plan): load phase 2b modules (overview, weekly update, milestones)"
          git rm -q .github/workflows/patch-sales-plan-2b.yml
          git commit -m "chore: remove one-shot patch-sales-plan-2b workflow"
          git pull --rebase origin main
          git push origin HEAD:main
