name: sd-multi-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-multi.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-multi-data.js' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "a26369142447fc45e6eb6d46bf3e2755277abcf6"
          for n in sd-multi-data sd-multi-send sd-multi-new sd-multi-client sd-multi-admin sd-multi-extra sd-pub-form sd-pub-approve; do test -f app/$n.js; test "$(git hash-object app/$n.js)" = "$(git hash-object build/app/$n.js)"; done
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./sd-wa-result.js?v=1"></script>\n'
          assert s.count(a)==1
          s=s.replace(a,a+''.join('<script src="./sd-multi-%s.js?v=1"></script>\n'%n for n in ['data','send','new','client','admin','extra']))
          for x,y in [('sd-pub-form.js?v=1','sd-pub-form.js?v=2'),('sd-pub-approve.js?v=2','sd-pub-approve.js?v=3')]:
              a='<script src="./%s"></script>'%x
              assert s.count(a)==1
              s=s.replace(a,'<script src="./%s"></script>'%y)
          open('/tmp/n.html','w').write(s)
          PY
          test "$(git hash-object /tmp/n.html)" = "01f9826a26e63051048ed1d2f2dfd07c3c0b7484"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: load sd-multi-* (multi-request groups), sd-pub-form ?v=2, sd-pub-approve ?v=3"
          git push
