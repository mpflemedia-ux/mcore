name: patch-projects-list-desktop
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact-string patch to app/projects.js
        run: |
          cat > /tmp/apply.py <<'PYEOF'
          p = 'app/projects.js'
          s = open(p, encoding='utf-8').read()
          A = "      '@media(max-width:800px){.pj-wrap{flex-direction:column}"
          NEW = "      '@media(min-width:801px){.pj-proj{flex-wrap:wrap;row-gap:4px}.pj-proj>button[data-proj]{flex:1 1 100%}.pj-proj>button[data-proj] span{white-space:normal;overflow-wrap:anywhere}.pj-proj small{flex:1 1 100%;margin-left:0;padding-left:16px}.pj-proj>button[data-proj-arch],.pj-proj>button[data-proj-restore]{margin-left:auto}}' +\n"
          n = s.count(A)
          assert n == 1, ('anchor count', n)
          assert s.count('@media(min-width:801px){.pj-proj') == 0, 'already patched'
          s = s.replace(A, NEW + A)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched')
          PYEOF
          python3 /tmp/apply.py
          node --check app/projects.js
          git diff --stat
      - name: Commit, remove workflow, push
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/projects.js
          git commit -m "fix(projects): project list fits on laptop"
          git rm -q .github/workflows/patch-projects-list-desktop.yml
          git commit -m "chore: remove one-shot patch-projects-list-desktop workflow"
          git pull --rebase origin main
          git push origin HEAD:main
