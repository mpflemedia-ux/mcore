name: sd-pub-index-tags-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-pub-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 4 sd-pub-*.js tags + bump sd-client ?v=2 in app/index.html (additive, blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./sd-pub-base.js' "$F"; then echo "already present - no-op"; exit 0; fi
          test "$(git hash-object "$F")" = "4b9ccf8b3928a78fa72a15d5047b4bc4bcfa1694"
          for n in base form owner approve; do test -f "app/sd-pub-$n.js"; test "$(git hash-object app/sd-pub-$n.js)" = "$(git hash-object build/app/sd-pub-$n.js)"; done
          A='<script src="./sd-ext.js?v=1"></script>'
          test "$(grep -cxF "$A" "$F")" = "1"
          test "$(grep -cxF '<script src="./sd-client.js?v=1"></script>' "$F")" = "1"
          T=$(mktemp)
          for n in base form owner approve; do echo "<script src=\"./sd-pub-$n.js?v=1\"></script>" >> "$T"; done
          awk -v a="$A" -v t="$T" '{ if ($0=="<script src=\"./sd-client.js?v=1\"></script>") print "<script src=\"./sd-client.js?v=2\"></script>"; else print } $0==a{while((getline l < t)>0) print l}' "$F" > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "eb827915bf151ede2dc7afe0289ab49ca96ac8c1"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "service desk public link: 4 sd-pub-*.js tags + sd-client ?v=2 in app/index.html (blob eb82791)"
          git push
