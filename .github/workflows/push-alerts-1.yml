name: push-alerts-1-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/push-alerts-1.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'notif-push.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "9395b6c6292b2e1a75ca11e10e2098a57c1b338b"
          test "$(git hash-object app/notif-push.js)" = "db602257e7d99e37fd80154c4d2894439e744400"
          test "$(git hash-object app/notif-push-ui.js)" = "7c02a45b1e56f1d1a337db65d39d2f0c6227bd9e"
          test "$(git hash-object app/sw.js)" = "9a310f33fe043a2cf5161e9868ffcc8d07588fba"
          test "$(git hash-object .github/oneshot/push1.py)" = "e44ccc78f3f018b35990526e41df9a67b5bd5eec"
          python3 .github/oneshot/push1.py "$F"
          test "$(git hash-object "$F")" = "78e75ee495e883bd404b32435787baad0c6d5971"
          test "$(git hash-object app/icons/badge-96.png)" = "aac0e055793736dcf94c75e790a5de990e60d0d0"
          git rm -q .github/oneshot/push1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F" app/icons/badge-96.png
          git commit -m "feat(push): phone alerts script tags, notif-core v3, sw v15, badge icon"
          git push
