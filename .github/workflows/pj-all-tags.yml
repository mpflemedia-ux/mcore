name: pj-all-index-tags-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-all-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All-projects tags in app/index.html (blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./pj-all-core.js' "$F"; then echo "already present - no-op"; exit 0; fi
          test "$(git hash-object "$F")" = "96163f312896cbed73cdec3b7477b01d9e19c4fa"
          for n in all-css all-core all-ui all-filter all-group; do
            test -f "app/pj-$n.js"
            test "$(git hash-object app/pj-$n.js)" = "$(git hash-object build/app/pj-$n.js)"
          done
          A='<script src="./pj-multi2-wa.js?v=1"></script>'
          test "$(grep -cxF "$A" "$F")" = "1"
          T=$(mktemp)
          for n in css core ui filter group; do echo "<script src=\"./pj-all-$n.js?v=1\"></script>" >> "$T"; done
          sed -e 's#^<script src="./projects.js?v=45"></script>$#<script src="./projects.js?v=46"></script>#' "$F" | awk -v a="$A" -v t="$T" '{print} $0==a{while((getline l < t)>0) print l}' > /tmp/new.html
          test "$(git hash-object /tmp/new.html)" = "d9caf3e41a1ea460d79640769ba41cfa54732f81"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "projects all-view: pj-all-*.js tags + projects.js v=46 in app/index.html (blob d9caf3e)"
          git push
