name: ff-crm-detail-metric-fit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ff-crm-detail-metric-fit.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch customer detail metric cards + SOA clip
        run: python3 scripts/crm_detail_metric_mobile_fit.py
      - name: Commit patched files
        run: |
          set -euo pipefail
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html build/app/index.html
          if git diff --cached --quiet; then
            echo "no index changes"
          else
            git commit -m "fix(crm): customer detail metric cards mobile fit"
            git push origin HEAD:main
          fi
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/ff-crm-detail-metric-fit.yml
          git add -A
          if git diff --cached --quiet; then
            echo "workflow already gone"
            exit 0
          fi
          git commit -m "chore: remove one-shot ff-crm-detail-metric-fit workflow"
          git push origin HEAD:main
