name: pay-attach-3-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pay-attach-3.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          G=app/public.html
          if grep -q 'pay-claim.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "8e7827c48ecdc8cf1b1b2af98cad9d67725ea7a0"
          test "$(git hash-object "$G")" = "2add9599c20fbfbb11ef0401ca2808b3fc74d6cf"
          test "$(git hash-object app/pay-claim.js)" = "4ce78d4dc4aef6577abfd98b89270c2933315c4c"
          test "$(git hash-object app/pay-claim-pub.js)" = "db55f4b1b29716f9ef1be45ca09b819f2ecdd0ca"
          test "$(git hash-object app/pay-rcpt.js)" = "ddffdb822400faf01e66749cdf5e434afe2e7b45"
          test "$(git hash-object app/pay-sheet.js)" = "c437152dc09c9520965ccaec93e39edaf1b37e9a"
          test "$(git hash-object .github/oneshot/pay3.py)" = "57921f162f68da15ef77b139582cfe68a471af6c"
          python3 .github/oneshot/pay3.py "$F" "$G"
          test "$(git hash-object "$F")" = "7467ced4336159a80acbbee377fc060d88bf8013"
          test "$(git hash-object "$G")" = "31ac183230af34afe8885253812579e92d918d20"
          git rm -q .github/oneshot/pay3.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F" "$G"
          git commit -m "feat(pay): customer slip box on public invoice + staff review / receipt / AI scripts (pay-claim, pay-rcpt, pay-claim-pub v1, pay-sheet v3)"
          git push
