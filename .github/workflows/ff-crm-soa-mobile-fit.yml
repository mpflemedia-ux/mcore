name: ff-crm-soa-mobile-fit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ff-crm-soa-mobile-fit.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bring layout-fix files from known commit onto main
        run: |
          set -euo pipefail
          FIX_SHA=cb0f5af1eec347ac0d88e15f615c99b1c7350d3b
          git fetch origin "$FIX_SHA"
          git checkout "$FIX_SHA" -- \
            app/index.html \
            build/app/index.html \
            supabase/crm_customer_detail_soa_mobile_fit_01.sql
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "files already match $FIX_SHA"
          else
            git commit -m "$(cat <<'EOF'
fix(crm): customer detail + SOA mobile layout fit

- Scope SOA+Edit under .crm-detail-actions so Edit no longer overlaps metric cards on mobile
- SOA invoices/payments tables: max-content + nowrap; scroll inside #soa-doc
- payment_method labels via methodLabel EN/BM (Bank Transfer etc.)
- Roadmap SQL write-only: supabase/crm_customer_detail_soa_mobile_fit_01.sql

Source: cb0f5af1eec347ac0d88e15f615c99b1c7350d3b (fix/crm-detail-soa-mobile-fit)
EOF
)"
            git push origin HEAD:main
          fi
      - name: Remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin main
          rm -f .github/workflows/ff-crm-soa-mobile-fit.yml
          git add -A
          if git diff --cached --quiet; then
            echo 'workflow already gone'
            exit 0
          fi
          git commit -m "chore: remove one-shot ff-crm-soa-mobile-fit workflow"
          git push origin HEAD:main
