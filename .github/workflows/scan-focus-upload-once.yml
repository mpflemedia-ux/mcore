        run: |
          python3 - << 'PY'
          import base64, os, pathlib
          old = base64.b64decode(''.join(os.environ['OLD_B64'].split()))
          new = base64.b64decode(''.join(os.environ['NEW_B64'].split()))
          path = pathlib.Path('app/index.html')
          text = path.read_bytes()
          count = text.count(old)
          if count != 1:
              raise SystemExit('scanner block count ' + str(count))
          text = text.replace(old, new, 1)
          if text.count(b'torch * 100000') != 1:
              raise SystemExit('marker missing')
          if text.count(b'function openBarcodeScanner') != 1 or text.count(b'function _scannerFileSelected') != 1:
              raise SystemExit('function count changed')
          path.write_bytes(text)
          PY
      - name: Commit and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/scan-focus-upload-once.yml
          git commit -m "fix(scan): use the sharpest back camera and read uploaded barcodes"
          git push origin HEAD:main
