name: planner-cal-fix-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pl-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply planner calendar fix patch to app/index.html (blob-guarded)
        run: |
          set -euo pipefail
          F=app/index.html
          if [ "$(git hash-object "$F")" = "fc2f6ca7d2ee6f05d8f73609271d423bad672a97" ]; then echo "already applied"; exit 0; fi
          test "$(git hash-object "$F")" = "c357fe80d53f49d1a12f40d9ff72a3a58b7c798b"
          git apply .github/plfix/planner.patch
          test "$(git hash-object "$F")" = "fc2f6ca7d2ee6f05d8f73609271d423bad672a97"
          git rm -q .github/plfix/planner.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "planner calendar: XSS escape, AA contrast, i18n keys, resize, tenant_id, month-range fetch (blob fc2f6ca)"
          git push
