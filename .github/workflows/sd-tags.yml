name: sd-index-tags-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mirror sd-*.js to build/app + insert 12 sd tags (additive, verified)
        run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'src="./sd-core.js' "$F"; then echo "tags already present - no-op"; exit 0; fi
          test "$(git hash-object "$F")" = "6e7515242d0f3586dd2c3eb37d0bffc9fef6d1fa"
          A='<script src="./onboarding-master-edit.js?v=1"></script>'
          test "$(grep -cxF "$A" "$F")" = "1"
          T=$(mktemp)
          for n in core css data contract contract-form client new detail board consent report ext; do
            echo "<script src=\"./sd-$n.js?v=1\"></script>" >> "$T"
            test -f "app/sd-$n.js"
            cp "app/sd-$n.js" "build/app/sd-$n.js"
            test "$(git hash-object app/sd-$n.js)" = "$(git hash-object build/app/sd-$n.js)"
          done
          awk -v a="$A" -v t="$T" '{print} $0==a{while((getline l < t)>0) print l}' "$F" > /tmp/new.html
          test "$(diff "$F" /tmp/new.html | grep -c '^<' || true)" = "0"
          test "$(diff "$F" /tmp/new.html | grep -c '^>' || true)" = "12"
          test "$(git hash-object /tmp/new.html)" = "4b9ccf8b3928a78fa72a15d5047b4bc4bcfa1694"
          cp /tmp/new.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F" build/app/sd-*.js
          git commit -m "service desk: 12 sd-*.js tags in app/index.html (additive, blob 4b9ccf8) + build/app mirror"
          git push
