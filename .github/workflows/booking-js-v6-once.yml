name: booking-js-v6-once

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: bump booking.js cache string
        run: |
          python3 - << 'PY'
          from pathlib import Path
          p = Path("app/index.html")
          data = p.read_bytes()
          old = b"./booking.js?v=5"
          new = b"./booking.js?v=6"
          n = data.count(old)
          if n != 1:
              raise SystemExit(1)
          p.write_bytes(data.replace(old, new, 1))
          PY

      - name: commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm .github/workflows/booking-js-v6-once.yml
          git commit -m "chore(booking): bust booking.js cache"
          git push origin HEAD:main
