name: pj-totals-bump-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-totals-bump.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'pj-all-ui.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "b9982aac335ff97de610eddb0b322cc5da327538"
          test "$(git hash-object app/pj-all-core.js)" = "a89ea7b747b7cf986d91d6238027d1c09cacf974"
          test "$(git hash-object build/app/pj-all-core.js)" = "a89ea7b747b7cf986d91d6238027d1c09cacf974"
          test "$(git hash-object app/pj-all-ui.js)" = "8c4f190bdd81d6127fe671616181294de5a573d3"
          test "$(git hash-object build/app/pj-all-ui.js)" = "8c4f190bdd81d6127fe671616181294de5a573d3"
          test "$(git hash-object app/pj-all-css.js)" = "0754e9cbfb48ff24fa56c7159dd3408223736fb1"
          test "$(git hash-object build/app/pj-all-css.js)" = "0754e9cbfb48ff24fa56c7159dd3408223736fb1"
          test "$(git hash-object app/projects.js)" = "7338776b507ab0728cc5e541089133efb4afd648"
          sed -i 's|./projects.js?v=46"|./projects.js?v=47"|; s|./pj-all-css.js?v=2"|./pj-all-css.js?v=3"|; s|./pj-all-core.js?v=4"|./pj-all-core.js?v=5"|; s|./pj-all-ui.js?v=1"|./pj-all-ui.js?v=2"|' "$F"
          test "$(git hash-object "$F")" = "3ae61d2237af6737d4a27ff257753ec852d4c68f"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(projects): bump projects v47, pj-all-core v5, pj-all-ui v2, pj-all-css v3"
          git push
