name: pa-banner-fix-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pa-banner-fix.yml']
permissions:
  contents: write
jobs:
  pa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'pa-core.js?v=3' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "e48bc2c8673b495b0448e419562b4e2918de32c4"
          test "$(git hash-object app/support-tenant.js)" = "bfbe9455ae8d0376e948c510d63e175f12bfd97b"
          test "$(git hash-object app/pa-core.js)" = "1f610fc38d4c07283c1f3aa0a3d3cd88bb738002"
          test "$(git hash-object app/nav-keys.js)" = "ef02aac8245ac196cec750c5597f533e75c2ff75"
          for n in support-tenant pa-core nav-keys; do test "$(git hash-object app/$n.js)" = "$(git hash-object build/app/$n.js)"; done
          sed -i 's#support-tenant.js?v=2#support-tenant.js?v=3#;s#pa-core.js?v=2#pa-core.js?v=3#;s#nav-keys.js?v=1#nav-keys.js?v=2#' "$F"
          test "$(git hash-object "$F")" = "3463d40d39124da4df6d6770b61b77598b5d41cd"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "fix(pa): bump support-tenant v3, pa-core v3, nav-keys v2 (single PA bar, no legacy support banner)"
          git push
