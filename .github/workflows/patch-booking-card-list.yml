name: patch-booking-card-list
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - app/booking-card-ui.js
      - app/booking-state.js
      - scripts/patch_booking_card_terminal.py
      - .github/workflows/patch-booking-card-list.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore card script and cachebust v=7
        run: python3 scripts/patch_booking_card_terminal.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/booking-card-ui.js app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(booking): restore card script with Delete on expired and cancelled"
          git pull --rebase origin main
          git push origin HEAD:main
