name: patch-payslip-accum-outstanding
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_payslip_accum_outstanding.py
      - app/payslip-accum-outstanding.js
      - .github/workflows/patch-payslip-accum-outstanding.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake payslip-accum-outstanding.js?v=1 into index.html
        run: python3 scripts/patch_payslip_accum_outstanding.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "chore: bake payslip-accum-outstanding overlay cache bust v=1 into index.html"
          git push
