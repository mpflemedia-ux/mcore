name: deploy-ffm-functions
# Deploys ONLY the FFM edge functions (ffm-api, ffm-webhook, ffm-cron) to Supabase project wjqhhnjlgoigoagsnsen.
# Needs repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account → Access Tokens). No other functions are touched.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/ffm-**'
      - 'supabase/functions/_shared/ffm-**'
      - '.github/workflows/deploy-ffm-functions.yml'
concurrency:
  group: deploy-ffm-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wjqhhnjlgoigoagsnsen
    steps:
      - name: Check secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error title=Missing secret::SUPABASE_ACCESS_TOKEN is not set. Add it in GitHub → repo Settings → Secrets and variables → Actions → New repository secret (value = Supabase personal access token from supabase.com/dashboard/account/tokens), then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ffm-api (JWT verified)
        run: supabase functions deploy ffm-api --project-ref "$PROJECT_REF" --use-api
      - name: Deploy ffm-webhook (no JWT — HMAC checked inside)
        run: supabase functions deploy ffm-webhook --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Deploy ffm-cron (no JWT — x-push-secret checked inside)
        run: supabase functions deploy ffm-cron --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Smoke check (must not be 404)
        run: |
          fail=0
          for f in ffm-api ffm-webhook ffm-cron; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/$f")
            echo "$f → HTTP $code"
            [ "$code" = "404" ] && fail=1
          done
          exit $fail
