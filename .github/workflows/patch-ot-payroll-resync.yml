name: patch-ot-payroll-resync
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ot_payroll_resync.py'
      - '.github/workflows/patch-ot-payroll-resync.yml'
      - 'app/ot-payroll-resync.js'
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch index.html
        run: python3 scripts/patch_ot_payroll_resync.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix(hr): bake OT approve→payroll resync into index (grandTotal+monthEnd+script)"
          git push origin HEAD:main
