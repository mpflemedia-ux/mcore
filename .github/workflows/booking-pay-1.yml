name: booking-pay-1-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/booking-pay-1.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'booking-pay-i18n.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "a59cdc9a0f3f31642fe7ecb5b64a336b8384dc32"
          test "$(git hash-object app/booking-pay-api.js)" = "b873d28709c307c40600c5302af922cbbd45b7dc"
          test "$(git hash-object app/booking-pay-dep.js)" = "20f0c650924093477a57e7b5339ad58f7c4ffa08"
          test "$(git hash-object app/booking-pay-i18n.js)" = "351fabe6941fdd666b519619cdb3b3670203546e"
          test "$(git hash-object app/booking-pay-pub-css.js)" = "541905b2e361a4a4c22445b97d343df8be9f000e"
          test "$(git hash-object app/booking-pay-pub-ui.js)" = "75782ed4ae1850b1305d215f4a25f414e4be861c"
          test "$(git hash-object app/booking-pay-pub.js)" = "1d4ddbc92327ebec6646b4cf8cc7f49b338b3cda"
          test "$(git hash-object app/booking-pay-q-css.js)" = "6ecef2463554ae8489b0fa78cc0a2d167d931450"
          test "$(git hash-object app/booking-pay-q.js)" = "3bbf85067988f4ab8d3c10f5002e5cb2c7e1871f"
          test "$(git hash-object app/booking-pay-ver.js)" = "9658a8edbf390a9ccdc01c0feb06c724cd4ad9d2"
          test "$(git hash-object .github/oneshot/bkpay1.py)" = "7a5be6b7f8d1a41fc4c72d9df3c72a4d2677cc1f"
          python3 .github/oneshot/bkpay1.py "$F"
          test "$(git hash-object "$F")" = "31972536516997b0cd269bdf135d8a659dc033bb"
          git rm -q .github/oneshot/bkpay1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "feat(booking-pay): app index.html script tags for booking payment flow (staff queue, verify, deposits)"
          git push
