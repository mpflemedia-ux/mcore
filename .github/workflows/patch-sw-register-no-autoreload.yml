name: patch-sw-register-no-autoreload
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_sw_register_no_autoreload.py
      - .github/workflows/patch-sw-register-no-autoreload.yml
      - app/sw.js
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake SW register (no auto-reload)
        run: python3 scripts/patch_sw_register_no_autoreload.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(sw): drop controllerchange auto-reload; register sw.js?v=13"
          git push origin HEAD:main
