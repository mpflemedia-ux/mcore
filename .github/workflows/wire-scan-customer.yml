name: wire-scan-customer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/wire_scan_customer_document.py
      - .github/workflows/wire-scan-customer.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire handler into ai-proxy
        run: python3 scripts/wire_scan_customer_document.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/ai-proxy/index.ts
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix: wire scan_customer_document into ai-proxy"
          git push
