name: sd-pa-tags-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-pa-tags.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-pa.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "d0f25bbeac4b0b63fc2c8fe262657e5d09356160"
          test "$(git hash-object app/sd-data.js)" = "$(git hash-object build/app/sd-data.js)"
          test "$(git hash-object app/sd-pa.js)" = "$(git hash-object build/app/sd-pa.js)"
          grep -q 'SD.paList' app/sd-data.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./sd-data.js?v=1"></script>'
          assert s.count(a)==1
          open('/tmp/n.html','w').write(s.replace(a,'<script src="./sd-data.js?v=2"></script>\n<script src="./sd-pa.js?v=1"></script>',1))
          PY
          test "$(git hash-object /tmp/n.html)" = "1a904ecf8ae974e02ff998aa5f2f6b000a85fa2c"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-data ?v=2 + sd-pa.js tag (platform admin bell)"
          git push
