name: one-shot wa-doc tags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/wa-doc-tags.yml']
permissions:
  contents: write
jobs:
  tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: guard + patch app/index.html
        run: |
          set -e
          test "$(git hash-object app/index.html)" = "b5d14a3c759f104b3536521d2485fafe14e9a4e7"
          for p in "app/wa-doc-core.js 51f7a4541a04222167e8c7334a90b3ce9355536c" "app/wa-doc-hooks.js 96be9ccea91061c00c6e238818d7d627934fc774" \
                   "app/wa-doc-i18n.js a3a1acb393cfb4ec437d6bc84f57865c69d38667" "app/wa-doc-public.js 3e9a756890cfd99147eb09a721d3b4024024b270" \
                   "app/wa-doc-remind.js 6a2dacf9a8cb3d00caf2e38fedf800cec02c0573" "app/wa-doc-sheet.js 2f760060e32f172c2f6e28eaa178cfc524b308d5" \
                   "build/app/wa-doc-core.js 51f7a4541a04222167e8c7334a90b3ce9355536c" "build/app/wa-doc-hooks.js 96be9ccea91061c00c6e238818d7d627934fc774" \
                   "build/app/wa-doc-i18n.js a3a1acb393cfb4ec437d6bc84f57865c69d38667" "build/app/wa-doc-public.js 3e9a756890cfd99147eb09a721d3b4024024b270" \
                   "build/app/wa-doc-remind.js 6a2dacf9a8cb3d00caf2e38fedf800cec02c0573" "build/app/wa-doc-sheet.js 2f760060e32f172c2f6e28eaa178cfc524b308d5" \
                   "app/public-inv-scroll.js 3cd731cd29600ac7f5e04f6d0da190d31295ca76" "app/public.html 0300eab661d35d2e6cbd5c7b93baad65a33c313b"; do
            set -- $p; test "$(git hash-object "$1")" = "$2" || { echo "blob mismatch $1"; exit 1; }
          done
          python3 - <<'PY'
          p = 'app/index.html'; s = open(p, encoding='utf-8').read()
          tags = ''.join('<script src="./wa-doc-%s.js?v=1"></script>\n' % f for f in ['i18n', 'core', 'sheet', 'hooks', 'remind', 'public'])
          a = '<script src="./pa-misc.js?v=1"></script>\n</body>'; assert s.count(a) == 1
          s = s.replace(a, '<script src="./pa-misc.js?v=1"></script>\n' + tags + '</body>')
          b = '<script src="./public-inv-scroll.js?v=4"></script>'; assert s.count(b) == 1
          s = s.replace(b, '<script src="./public-inv-scroll.js?v=5"></script>')
          open(p, 'w', encoding='utf-8', newline='').write(s)
          PY
          test "$(git hash-object app/index.html)" = "c0a07f030bfc0ba22318c444a77370dbe5f99643"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "feat: WhatsApp doc share Phase 1 script tags (wa-doc-*.js v1) + public-inv-scroll v=5"
          git push
