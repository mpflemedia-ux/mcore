name: ff-crm-metric-font-equal
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ff-crm-metric-font-equal.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch + commit + remove one-shot
        run: |
          set -euo pipefail
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in app/index.html build/app/index.html; do
            sed -i 's|<div class="stat-value" style="font-size:16px">${lastOrder}</div>|<div class="stat-value">${lastOrder}</div>|' "$f"
          done
          git add app/index.html build/app/index.html
          if ! git diff --cached --quiet; then
            git commit -m "fix(crm): customer detail Last metric value same font size as other cards (drop inline 16px)"
            git push origin HEAD:main
          fi
          git pull --ff-only origin main
          git rm -q .github/workflows/ff-crm-metric-font-equal.yml
          git commit -m "chore: remove one-shot ff-crm-metric-font-equal workflow"
          git push origin HEAD:main
