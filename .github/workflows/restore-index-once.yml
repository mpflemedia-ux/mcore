name: restore-index-once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Restore index and payment row
        run: |
          git fetch --depth=1 origin 6b7e39d61cf99a92759233e72e04dd8338247a12
          git checkout 6b7e39d61cf99a92759233e72e04dd8338247a12 -- app/index.html
          python3 - << 'PY'
          from pathlib import Path
          p = Path('app/index.html')
          text = p.read_text()
          old = '    <div id="pay-form-err" class="auth-error" style="display:none;margin-bottom:12px"></div>\n    <div style="display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:flex-end">'
          new = '    <div id="pay-form-err" class="auth-error" style="display:none;margin-bottom:12px"></div>\n    <div style="display:grid;grid-template-columns:minmax(150px,1fr) minmax(120px,1fr) minmax(150px,1fr) max-content;gap:12px;align-items:flex-end;overflow-x:auto;max-width:100%;min-width:0;white-space:nowrap;word-break:normal;overflow-wrap:normal;-webkit-overflow-scrolling:touch">'
          n = text.count(old)
          if n != 1:
              raise SystemExit('expected 1 payment-row match, got %s' % n)
          text = text.replace(old, new, 1)
          if text.count('grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:flex-end') != 1:
              raise SystemExit('bill payment row was not left unchanged')
          if 'minmax(150px,1fr) minmax(120px,1fr) minmax(150px,1fr) max-content' not in text:
              raise SystemExit('new payment row style missing')
          p.write_text(text)
          PY
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/restore-index-once.yml
          git commit -m "fix(sales): restore index.html and keep Record Payment on one scrollable row"
          git push origin HEAD:main
          git push origin --delete tmp-srcpath-probe || true
