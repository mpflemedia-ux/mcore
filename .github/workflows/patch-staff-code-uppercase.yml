name: patch-staff-code-uppercase
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Uppercase Staff ID in app/index.html
        run: |
          python3 - << 'ENDPATCH'
          from pathlib import Path
          import sys
          p = Path('app/index.html')
          text = p.read_text(encoding='utf-8')

          old_input = '<input id="emp-staff-code" class="form-input" value="${_aiEscapeHtml(src.staff_code||\'\')}">'
          new_input = '<input id="emp-staff-code" class="form-input" data-no-titlecase="1" autocapitalize="characters" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()" value="${_aiEscapeHtml(String(src.staff_code||\'\').trim().toUpperCase())}">'

          old_read = "let staffCode = String((document.getElementById('emp-staff-code')||{}).value||'').trim()\n"
          new_read = "let staffCode = String((document.getElementById('emp-staff-code')||{}).value||'').trim().toUpperCase()\n"

          old_gen = "staffCode = prefix + '-' + String(maxN + 1).padStart(4, '0')\n"
          new_gen = "staffCode = (prefix + '-' + String(maxN + 1).padStart(4, '0')).toUpperCase()\n"

          def apply(text, old, new, label):
              n = text.count(old)
              if n == 1:
                  print('patch', label)
                  return text.replace(old, new, 1), True
              if n == 0 and new in text:
                  print('already', label)
                  return text, False
              print('BAD', label, 'count', n)
              i = text.find('emp-staff-code')
              print('CONTEXT', repr(text[max(0, i-120):i+500]) if i >= 0 else 'no emp-staff-code')
              i2 = text.find('let staffCode')
              print('READ', repr(text[i2:i2+220]) if i2 >= 0 else 'no staffCode')
              i3 = text.find("staffCode = prefix")
              print('GEN', repr(text[i3:i3+160]) if i3 >= 0 else 'no gen')
              sys.exit(1)

          if "staff_code: staffCode ? staffCode : null" not in text:
              print('BAD missing null payload')
              sys.exit(1)
          if text.count('>Staff ID<') != 1:
              print('BAD Staff ID label count', text.count('>Staff ID<'))
              sys.exit(1)

          changed = False
          text, c = apply(text, old_input, new_input, 'input')
          changed = changed or c
          text, c = apply(text, old_read, new_read, 'read')
          changed = changed or c
          text, c = apply(text, old_gen, new_gen, 'gen')
          changed = changed or c

          if "staff_code: staffCode ? staffCode : null" not in text:
              print('BAD payload lost')
              sys.exit(1)
          if text.count('>Staff ID<') != 1:
              print('BAD label lost')
              sys.exit(1)
          if "trim().toUpperCase()" not in text:
              print('BAD save upper missing')
              sys.exit(1)
          if ")).toUpperCase()" not in text:
              print('BAD generated upper missing')
              sys.exit(1)
          if 'data-no-titlecase="1"' not in text or 'text-transform:uppercase' not in text:
              print('BAD input display attrs missing')
              sys.exit(1)

          if changed:
              p.write_text(text, encoding='utf-8')
              print('wrote', p)
          else:
              print('no change')

          ENDPATCH
      - name: Commit index.html and remove this workflow
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/index.html
          if git diff --cached --quiet; then
            echo "index unchanged"
          else
            git commit -m "fix(hr): store and show Staff ID in uppercase"
          fi
          git rm -f -- .github/workflows/patch-staff-code-uppercase.yml
          git commit -m "chore: remove one-shot Staff ID uppercase workflow"
          git push origin HEAD:main
