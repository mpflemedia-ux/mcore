          scripts/patch_att_field_notes_ui.py
          scripts/patch_att_notes_optional.py
          scripts/patch_booking_card_terminal.py
          scripts/patch_booking_hold_minutes.py
          scripts/patch_child_nav_sidebar.py
          scripts/patch_child_page_access_v9.py
          scripts/patch_crm_customer_detail_mobile.py
          scripts/patch_crm_customer_source.py
          scripts/patch_crm_scan_cachebust.py
          scripts/patch_expense_claims_access_v10.py
          scripts/patch_hr_attendance_view.py
          scripts/patch_invoice_customer.py
          scripts/patch_modsnow_role_key_v8.py
          scripts/patch_nav_items_lexical_v7.py
          scripts/patch_payslip_accum_outstanding.py
          scripts/patch_payslip_pay_date.py
          scripts/patch_payslip_statutory_partial.py
          scripts/patch_pdoc_customer_lock.py
          scripts/patch_planner_support_customers.py
          scripts/patch_print_multipage.py
          scripts/patch_pvd_col_widths.py
          scripts/patch_rbac_least_privilege.py
          scripts/patch_sd_print_a4_portrait.py
          scripts/patch_sd_table_fit_v10.py
          scripts/patch_settings_audit_mobile.py
          scripts/patch_settings_form_fit.py
          scripts/patch_settings_public_booking_shortcut.py
          scripts/patch_sw_register_no_autoreload.py
          scripts/sd_employer_edit.js.gz.b64
          scripts/sd_print_a4_rowhtml.fragment.js.gz.b64
          scripts/wire_customer_public_form.py
          scripts/wire_scan_customer_document.py
          LISTEOF
          sed -i 's/^ *//' /tmp/files.txt
          sed -i '/^$/d' /tmp/files.txt
          test "$(wc -l < /tmp/files.txt)" = "122"
          while IFS= read -r f; do test -f "$f" || { echo "MISSING: $f"; exit 1; }; done < /tmp/files.txt
          while IFS= read -r f; do git rm -q -- "$f"; done < /tmp/files.txt
          git diff --cached --name-only | sort > /tmp/staged.txt
          sort /tmp/files.txt > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/staged.txt
          if grep -E '^(app|supabase)/' /tmp/staged.txt; then echo "touches app/ or supabase/"; exit 1; fi
          test -z "$(git diff --cached --diff-filter=d --name-only)"
          test -z "$(git diff --name-only)"
          git diff --cached --stat | tail -1
      - name: Commit, remove this workflow, push
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "chore(ci): remove legacy one-shot patch workflows"
          git rm -q .github/workflows/cleanup-legacy-workflows.yml
          git commit -q -m "chore: remove one-shot cleanup-legacy-workflows workflow"
          git pull --rebase origin main
          git push origin HEAD:main
