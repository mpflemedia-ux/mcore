name: cleanup-legacy-workflows
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove exact list of legacy workflow files and their helper scripts
        run: |
          cat > /tmp/files.txt <<'LISTEOF'
          .github/workflows/patch-att-field-notes-ui.yml
          .github/workflows/patch-att-notes-optional.yml
          .github/workflows/patch-booking-card-list.yml
          .github/workflows/patch-booking-hold-minutes.yml
