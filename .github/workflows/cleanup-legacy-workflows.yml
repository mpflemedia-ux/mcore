          .github/workflows/patch-crm-customer-detail-mobile.yml
          .github/workflows/patch-crm-customer-source-filter.yml
          .github/workflows/patch-crm-customer-source.yml
          .github/workflows/patch-crm-scan-cachebust.yml
          .github/workflows/patch-expense-claims-access-v10.yml
          .github/workflows/patch-hr-attendance-view.yml
          .github/workflows/patch-invoice-customer.yml
          .github/workflows/patch-modsnow-role-key-v8.yml
          .github/workflows/patch-nav-items-lexical-v7.yml
