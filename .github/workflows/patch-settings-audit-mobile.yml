name: patch-settings-audit-mobile
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_settings_audit_mobile.py
      - .github/workflows/patch-settings-audit-mobile.yml
      - app/settings-audit-mobile.css
      - app/sw.js
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake Settings Audit mobile CSS into index.html
        run: python3 scripts/patch_settings_audit_mobile.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(settings): bake Audit Log mobile overflow into index.html"
          git push
