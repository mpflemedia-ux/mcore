name: sr-tlf-1-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sr-tlf-1.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-tl-files.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "c18ecd7e2ab04d1277c8dae476dfba240e8f29af"
          test "$(git hash-object app/sd-tl-files.js)" = "92dd2c62bbf84cb15f2a7675e375c168bee5e0d3"
          test "$(git hash-object .github/oneshot/tlf.py)" = "c4013ad74aba4a80502fcb83f6cdd2e6d65454f2"
          python3 .github/oneshot/tlf.py "$F"
          test "$(git hash-object "$F")" = "9395b6c6292b2e1a75ca11e10e2098a57c1b338b"
          git rm -q .github/oneshot/tlf.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "feat(sd): timeline file previews script tag (sd-tl-files v1)"
          git push
