name: sd-css-v3-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-css-v3.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-css.js?v=3' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "7ceb054a48882951bc329eb8bfb32c92e846f7c9"
          test "$(git hash-object app/sd-css.js)" = "$(git hash-object build/app/sd-css.js)"
          grep -q 'sd-pack.pdoc' app/sd-css.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./sd-css.js?v=2"></script>'
          assert s.count(a)==1
          open('/tmp/n.html','w').write(s.replace(a,'<script src="./sd-css.js?v=3"></script>',1))
          PY
          test "$(git hash-object /tmp/n.html)" = "11bfe751c5a19f770617da70eb4e4437fc452ff8"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-css.js ?v=3 (monthly pack dark mode)"
          git push
