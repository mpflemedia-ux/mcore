name: booking-theme-1-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/booking-theme-1.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'booking-pub-css.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "c696d0af67fe3842e4b3d507024972eb1d3ac167"
          test "$(git hash-object app/booking-pub-css.js)" = "1994d187efc7340d3a70e531ca54aadd21a6bddf"
          test "$(git hash-object app/booking-pub-i18n.js)" = "61c92ef8f4faae0508beb248ae982cff28373599"
          test "$(git hash-object app/booking-public-contrast.js)" = "614bfbd106b7d97a78e30a476caf66c68c110ab9"
          test "$(git hash-object .github/oneshot/bktheme1.py)" = "c9f66bd6a6713825c70dd28835f1f8e6785992e2"
          python3 .github/oneshot/bktheme1.py "$F"
          test "$(git hash-object "$F")" = "a59cdc9a0f3f31642fe7ecb5b64a336b8384dc32"
          git rm -q .github/oneshot/bktheme1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "feat(booking): public booking page dark M-Core theme + EN/BM toggle (script tags, contrast v2)"
          git push
