name: patch-rbac-least-privilege
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_rbac_least_privilege.py
      - .github/workflows/patch-rbac-least-privilege.yml
      - app/role-permissions-sync.js
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake RBAC least-privilege into index.html
        run: python3 scripts/patch_rbac_least_privilege.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(rbac): bake least-privilege gates into index.html (vouchers, delete, sync v4)"
          git push origin HEAD:main
