name: patch-crm-scan-cachebust
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/patch_crm_scan_cachebust.py
      - scripts/_crm_scan_chunks/**
      - app/crm-scan.js
      - .github/workflows/patch-crm-scan-cachebust.yml
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Assemble crm-scan.js + bake ?v=2 into index.html
        run: python3 scripts/patch_crm_scan_cachebust.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/crm-scan.js app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "chore: assemble crm-scan.js V2 + cache bust v=2 into index.html"
          git pull --rebase origin main
          git push
