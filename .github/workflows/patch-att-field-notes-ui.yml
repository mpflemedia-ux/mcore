name: patch-att-field-notes-ui
on:
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bake Log Attendance field-notes UX
        run: python3 scripts/patch_att_field_notes_ui.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fix(hr): Log Attendance Field/WFH notes UX (badge, required hint, clearer toast)"
          git push origin HEAD:main
