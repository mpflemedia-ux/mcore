name: pj-sum-wrap-bump-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-sum-wrap-bump.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'pj-all-ui.js?v=3' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "de3be0a330f69a84aa8d01cb9534a4fe12fec413"
          test "$(git hash-object app/pj-all-css.js)" = "5b2a79f3b22b78e27f794c0fc1b26ae229a50913"
          test "$(git hash-object build/app/pj-all-css.js)" = "5b2a79f3b22b78e27f794c0fc1b26ae229a50913"
          test "$(git hash-object app/pj-all-ui.js)" = "a0de794a11150747c63d38b1a25f80cabebd873a"
          test "$(git hash-object build/app/pj-all-ui.js)" = "a0de794a11150747c63d38b1a25f80cabebd873a"
          sed -i 's|./pj-all-css.js?v=3"|./pj-all-css.js?v=4"|; s|./pj-all-ui.js?v=2"|./pj-all-ui.js?v=3"|' "$F"
          test "$(git hash-object "$F")" = "b2da2f50dbc88cbd31f0af346281413ce9bc266e"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(projects): bump pj-all-css v4, pj-all-ui v3 (wrap chips)"
          git push
