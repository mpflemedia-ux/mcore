name: restore-onboarding-ready-buttons
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Restore index.html from last good commit and drop two buttons
        run: |
          git checkout db629e6f231353ac241f99eba9c1f91a0b457f65 -- app/index.html
          python3 << 'PY'
          import base64
          from pathlib import Path
          p = Path('app/index.html')
          text = p.read_text()
          if len(text) < 1_000_000:
              raise SystemExit('index.html still too small after restore: %s' % len(text))
          old = base64.b64decode(
              ''
          ).decode()
          n = text.count(old)
          if n != 1:
              raise SystemExit('ready-screen button block count %s' % n)
          text = text.replace(old, '', 1)
          if 'Invite team' in text or 'Jemput pasukan' in text:
              raise SystemExit('labels still present')
          if text.count('Go to Dashboard') != 1:
              raise SystemExit('dashboard button count')
          if 'nexerp_show_golive_banner' not in text or 'stg-golive' not in text:
              raise SystemExit('unrelated onboarding bits missing')
          if 'async function obFinish()' not in text:
              raise SystemExit('obFinish missing')
          p.write_text(text)
          print('patched', len(text))
          PY
      - name: Commit restored index and remove this workflow
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/restore-onboarding-ready-buttons.yml
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "fix(onboarding): drop Invite team and Go-Live buttons on the ready screen"
          git pull --rebase origin main
          git push origin HEAD:main
