name: patch-svc-commission
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_svc_commission.py'
      - '.github/workflows/patch-svc-commission.yml'
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add/bump svc-commission.js + dk-doc.js script tags
        run: python3 scripts/patch_svc_commission.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(hr): bump svc-commission.js / dk-doc.js script versions (service commission statement)"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done; exit 1
