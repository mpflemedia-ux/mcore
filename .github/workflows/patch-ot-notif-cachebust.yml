name: patch-ot-notif-cachebust
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_ot_notif_cachebust.py'
      - '.github/workflows/patch-ot-notif-cachebust.yml'
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump notif-live cache
        run: python3 scripts/patch_ot_notif_cachebust.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "chore(notif): cache-bust notif-live.js?v=5 (OT Approvals live wire)"
          git push origin HEAD:main
