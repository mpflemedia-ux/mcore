name: sd-css-v2-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-css-v2.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-css.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "ffcfa800a09e13e0622a64e55b3a822ffe62877e"
          test "$(git hash-object app/sd-css.js)" = "$(git hash-object build/app/sd-css.js)"
          grep -q 'max-width:768px){.sd-board' app/sd-css.js
          sed 's#<script src="./sd-css.js?v=1"></script>#<script src="./sd-css.js?v=2"></script>#' "$F" > /tmp/n.html
          test "$(git hash-object /tmp/n.html)" = "f9aabe2e6153ee3b1672a83bf60159819470ebc4"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "service desk: sd-css.js ?v=2 (mobile stacked board)"
          git push
