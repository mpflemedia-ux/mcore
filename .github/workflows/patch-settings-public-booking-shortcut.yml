name: patch-settings-public-booking-shortcut
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/settings-public-booking-shortcut
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bake Public booking shortcut into index.html
        run: python3 scripts/patch_settings_public_booking_shortcut.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "feat(settings): bake Public booking shortcut into index.html"
          git push origin HEAD:fix/settings-public-booking-shortcut
