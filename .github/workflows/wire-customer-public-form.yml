name: wire-customer-public-form
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/wire_customer_public_form.py
      - .github/workflows/wire-customer-public-form.yml
      - app/customer-public-form.js
      - app/sw.js
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Wire script tag into index.html
        run: python3 scripts/wire_customer_public_form.py
      - name: Commit
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git diff --cached --quiet && echo 'nothing' && exit 0
          git commit -m "chore(crm): wire customer-public-form.js into index.html"
          git push
