name: sd-css-v5-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-css-v5.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-css.js?v=5' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "016507513601cb48cd4e082b970a8f06a2a2cc19"
          test "$(git hash-object app/sd-css.js)" = "$(git hash-object build/app/sd-css.js)"
          grep -q 'padding-right:56px' app/sd-css.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./sd-css.js?v=4"></script>'
          assert s.count(a)==1
          open('/tmp/n.html','w').write(s.replace(a,'<script src="./sd-css.js?v=5"></script>',1))
          PY
          test "$(git hash-object /tmp/n.html)" = "d0f25bbeac4b0b63fc2c8fe262657e5d09356160"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-css.js ?v=5 (monthly pack mobile fit)"
          git push
