name: sd-pack-v4-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-pack-v4.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-css.js?v=4' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "11bfe751c5a19f770617da70eb4e4437fc452ff8"
          test "$(git hash-object app/sd-css.js)" = "$(git hash-object build/app/sd-css.js)"
          test "$(git hash-object app/sd-report.js)" = "$(git hash-object build/app/sd-report.js)"
          grep -q 'cob-tbl{min-width:0}' app/sd-css.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          for a,b in [('sd-css.js?v=3','sd-css.js?v=4'),('sd-report.js?v=1','sd-report.js?v=2')]:
              a='<script src="./%s"></script>'%a
              assert s.count(a)==1
              s=s.replace(a,'<script src="./%s"></script>'%b,1)
          open('/tmp/n.html','w').write(s)
          PY
          test "$(git hash-object /tmp/n.html)" = "016507513601cb48cd4e082b970a8f06a2a2cc19"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-css ?v=4 + sd-report ?v=2 (monthly pack tables)"
          git push
