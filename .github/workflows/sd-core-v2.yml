name: sd-core-v2-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-core-v2.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-core.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "99b6cbff405fe94b0007f8bc3ff53b08d5663a5b"
          test "$(git hash-object app/sd-core.js)" = "$(git hash-object build/app/sd-core.js)"
          grep -q 'SD.need' app/sd-core.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          a='<script src="./sd-core.js?v=1"></script>'
          assert s.count(a)==1
          open('/tmp/n.html','w').write(s.replace(a,'<script src="./sd-core.js?v=2"></script>',1))
          PY
          test "$(git hash-object /tmp/n.html)" = "7ceb054a48882951bc329eb8bfb32c92e846f7c9"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-core.js ?v=2 (boot race fix)"
          git push
