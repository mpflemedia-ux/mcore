name: patch-sales-plan-2d
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify phase 2d module files (exact blob SHAs) and parse
        run: |
          check() { test -s "app/$1.js" || { echo "missing app/$1.js"; exit 1; }; node --check "app/$1.js"; h=$(git hash-object "app/$1.js"); test "$h" = "$2" || { echo "sha mismatch app/$1.js $h != $2"; exit 1; }; }
          check sales-plan-alerts 1fc19df3305e6b913f8b27d64f104fcd8dd0774a
          check sales-plan-report af8266502f59ce5ba38615b4240bc74e3c77bdde
          check sales-plan-import-map a4cf0262881460a0be30b8465ef5940427585573
          check sales-plan-import 29b29b0f7a3b53741760cf20d9ac9815256e89b7
          check sales-plan-css5 6257f38a41c5007cd84f5f97cd65bc68aa5578f5
          check sales-plan-list-ui 113d3425c3ea4021f5042b33e741b3dea1e357e0
      - name: Add 5 script tags after the sales-plan css4 tag and bump list-ui to v=2
        run: |
          cat > /tmp/apply.py <<'PYEOF'
          import sys
          p = sys.argv[1]
          s = open(p, encoding='utf-8').read()
          NEW = ['sales-plan-alerts', 'sales-plan-report', 'sales-plan-import-map', 'sales-plan-import', 'sales-plan-css5']
          ANCHOR = '<script src="./sales-plan-css4.js?v=1"></script>\n'
          OLD_LU = '<script src="./sales-plan-list-ui.js?v=1"></script>'
          NEW_LU = '<script src="./sales-plan-list-ui.js?v=2"></script>'
          if 'sales-plan-alerts.js' in s:
              sys.exit('already patched')
          assert s.count(ANCHOR) == 1, ('anchor', s.count(ANCHOR))
          assert s.count(OLD_LU) == 1, ('list-ui', s.count(OLD_LU))
          s = s.replace(ANCHOR, ANCHOR + ''.join('<script src="./%s.js?v=1"></script>\n' % f for f in NEW))
          s = s.replace(OLD_LU, NEW_LU)
          open(p, 'w', encoding='utf-8').write(s)
          print('patched OK')
          PYEOF
          python3 /tmp/apply.py app/index.html
          git diff --stat
          git diff
          test "$(git diff --numstat app/index.html | awk '{print $1" "$2}')" = "6 1"
          test "$(git diff -U0 app/index.html | grep '^[-+]<' | grep -vc 'sales-plan')" = "0"
      - name: Commit, remove workflow, push
        run: |
          git config user.name "mcore-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git commit -m "feat(sales-plan): load phase 2d modules (alerts, report, import)"
          git rm -q .github/workflows/patch-sales-plan-2d.yml
          git commit -m "chore: remove one-shot patch-sales-plan-2d workflow"
          git pull --rebase origin main
          git push origin HEAD:main
