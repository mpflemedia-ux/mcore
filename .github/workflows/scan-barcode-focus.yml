name: scan barcode focus
on:
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Taller barcode window
        run: |
          python3 - << 'PY'
          import base64
          from pathlib import Path
          p = Path('app/index.html')
          text = p.read_text()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          n = text.count(old)
          if n != 1:
              raise SystemExit('expected 1 scanner start, found %s' % n)
          text = text.replace(old, new, 1)
          if 'Math.min(120' in text:
              raise SystemExit('thin box still present')
          if text.count("focusMode: 'continuous'") != 1:
              raise SystemExit('focus constraint missing')
          if 'function openBarcodeScanner' not in text:
              raise SystemExit('scanner function missing')
          if text.count('_scannerHtml5Qrcode.start(') != 1:
              raise SystemExit('start call count changed')
          p.write_text(text)
          print('patched', len(text))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/scan-barcode-focus.yml
          git commit -m "fix(scan): taller barcode window and continuous focus"
          git push origin HEAD:main
