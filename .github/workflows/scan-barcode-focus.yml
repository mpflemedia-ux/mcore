name: scan barcode focus
on:
  workflow_dispatch:
jobs:
  bake:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Main camera and file scan
        run: |
          python3 - << 'PY'
          import base64
          from pathlib import Path
          p = Path('app/index.html')
          text = p.read_text()
          old1 = base64.b64decode('').decode()
          new1 = base64.b64decode('').decode()
          old2 = base64.b64decode('').decode()
          new2 = base64.b64decode('').decode()
          if text.count(old1) != 1:
              raise SystemExit('scanner start count %s' % text.count(old1))
          if text.count(old2) != 1:
              raise SystemExit('file scan count %s' % text.count(old2))
          text = text.replace(old1, new1, 1).replace(old2, new2, 1)
          if text.count('function openBarcodeScanner') != 1:
              raise SystemExit('open missing')
          if text.count('function _scannerFileSelected') != 1:
              raise SystemExit('file fn missing')
          if text.count('_scannerHtml5Qrcode.start(') != 1:
              raise SystemExit('start count')
          if text.count('Html5Qrcode.getCameras') != 1:
              raise SystemExit('camera pick missing')
          if 'function _scannerManualSubmit' not in text:
              raise SystemExit('manual missing')
          p.write_text(text)
          print('patched', len(text))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/index.html
          git rm -f .github/workflows/scan-barcode-focus.yml
          git commit -m "fix(scan): use the main camera and allow image upload"
          git push origin HEAD:main
