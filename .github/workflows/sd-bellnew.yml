name: sd-bellnew-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-bellnew.yml']
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'sd-pa.js?v=2' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "1a904ecf8ae974e02ff998aa5f2f6b000a85fa2c"
          for n in sd-pa sd-new sd-pub-approve; do test "$(git hash-object app/$n.js)" = "$(git hash-object build/app/$n.js)"; done
          grep -q 'SD.bellNew' app/sd-pa.js
          python3 - <<'PY'
          s=open('app/index.html').read()
          for a,b in [('sd-pa.js?v=1','sd-pa.js?v=2'),('sd-new.js?v=1','sd-new.js?v=2'),('sd-pub-approve.js?v=1','sd-pub-approve.js?v=2')]:
              a='<script src="./%s"></script>'%a
              assert s.count(a)==1
              s=s.replace(a,'<script src="./%s"></script>'%b,1)
          open('/tmp/n.html','w').write(s)
          PY
          test "$(git hash-object /tmp/n.html)" = "a26369142447fc45e6eb6d46bf3e2755277abcf6"
          cp /tmp/n.html "$F"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "sd: sd-pa ?v=2, sd-new ?v=2, sd-pub-approve ?v=2 (new request bells)"
          git push
