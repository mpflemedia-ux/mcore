name: sd-result-deploy-oneshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sd-result-deploy.yml']
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy sd-result
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy sd-result --no-verify-jwt --project-ref wjqhhnjlgoigoagsnsen
