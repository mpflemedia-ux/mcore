name: pj-list-filter-bump-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pj-list-filter-bump.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'projects.js?v=48' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "b2da2f50dbc88cbd31f0af346281413ce9bc266e"
          test "$(git hash-object app/projects.js)" = "60ac1155c530ab40137f16781cf162fbd02b95d6"
          test "$(git hash-object app/pj-all-core.js)" = "981c1842099be9d451b414d02273ef1582ee7063"
          test "$(git hash-object build/app/pj-all-core.js)" = "981c1842099be9d451b414d02273ef1582ee7063"
          test "$(git hash-object app/pj-all-ui.js)" = "4993203153a37a485c65b2a93fe9e128b25d605f"
          test "$(git hash-object build/app/pj-all-ui.js)" = "4993203153a37a485c65b2a93fe9e128b25d605f"
          test "$(git hash-object app/pj-all-css.js)" = "fc0b17972bfe716a299bfa08664f315c1f171157"
          test "$(git hash-object build/app/pj-all-css.js)" = "fc0b17972bfe716a299bfa08664f315c1f171157"
          sed -i 's|./projects.js?v=47"|./projects.js?v=48"|; s|./pj-all-css.js?v=4"|./pj-all-css.js?v=5"|; s|./pj-all-core.js?v=5"|./pj-all-core.js?v=6"|; s|./pj-all-ui.js?v=3"|./pj-all-ui.js?v=4"|' "$F"
          test "$(git hash-object "$F")" = "c90fc1b4c6d48d477a454fda96a9b1629e926504"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(projects): bump projects v48, pj-all-core v6, pj-all-ui v4, pj-all-css v5"
          git push
