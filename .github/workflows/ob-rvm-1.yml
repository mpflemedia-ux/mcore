name: ob-rvm-1-oneshot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ob-rvm-1.yml']
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          F=app/index.html
          if grep -q 'onboarding-review-mobile.js?v=1' "$F"; then echo no-op; exit 0; fi
          test "$(git hash-object "$F")" = "4770da29d5339f3e3afb8e806b78e69a04429081"
          test "$(git hash-object app/onboarding-review-mobile.js)" = "f44441f11025330a41dc1cfca458ebc102c0edc3"
          test "$(git hash-object .github/oneshot/rvm.py)" = "dc9a11f4cefe693d77cb320812afb10d290af00e"
          python3 .github/oneshot/rvm.py "$F"
          test "$(git hash-object "$F")" = "c18ecd7e2ab04d1277c8dae476dfba240e8f29af"
          git rm -q .github/oneshot/rvm.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$F"
          git commit -m "fix(cob): onboarding review mobile detail view script tag (onboarding-review-mobile v1)"
          git push
