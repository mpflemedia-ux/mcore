<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexERP — The ERP That Understands Your Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary:#2563EB;--primary-dark:#1D4ED8;--primary-light:#EFF6FF;
  --secondary:#7C3AED;--success:#16A34A;--warning:#D97706;--danger:#DC2626;--info:#0891B2;
  --bg:#F8FAFC;--bg-card:#FFFFFF;--bg-sidebar:#1E293B;--bg-sidebar2:#0F172A;
  --text:#0F172A;--text-2:#475569;--text-3:#94A3B8;--text-inv:#F8FAFC;
  --border:#E2E8F0;--border-2:#CBD5E1;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);--shadow:0 4px 12px rgba(0,0,0,.10);--shadow-lg:0 10px 30px rgba(0,0,0,.12);
  --radius:10px;--radius-sm:6px;--radius-lg:16px;
  --sidebar-w:240px;--header-h:60px;--font:'Inter',sans-serif;--transition:.18s ease;
}
[data-theme="dark"]{
  --bg:#0F172A;--bg-card:#1E293B;--bg-sidebar:#0A0F1E;
  --text:#F1F5F9;--text-2:#94A3B8;--text-3:#475569;
  --border:#1E293B;--border-2:#334155;--primary-light:#1E3A5F;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit}

/* LAYOUT */
#app{display:flex;height:100vh;overflow:hidden}
#auth-page{display:flex;align-items:center;justify-content:center;width:100%;min-height:100vh;background:linear-gradient(135deg,#1E293B 0%,#0F172A 50%,#1a1060 100%)}
#shell{display:none;flex:1;overflow:hidden}
#shell.active{display:flex}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:var(--bg-sidebar);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);overflow:hidden;transition:width var(--transition);z-index:100}
#sidebar.collapsed{width:60px;min-width:60px}
.sidebar-logo{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.07);min-height:var(--header-h)}
.sidebar-logo .logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;flex-shrink:0}
.sidebar-logo .logo-text{font-size:16px;font-weight:700;color:#fff;transition:opacity var(--transition)}
.sidebar-logo .logo-sub{font-size:9px;color:rgba(255,255,255,.4);letter-spacing:.5px;text-transform:uppercase}
#sidebar.collapsed .sidebar-logo-img{display:none}
#sidebar.collapsed .sidebar-logo-icon-only{display:block !important}

.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px}
.nav-section{padding:12px 12px 4px;font-size:10px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.3);transition:opacity var(--transition)}
#sidebar.collapsed .nav-section{opacity:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:1px 8px;border-radius:var(--radius-sm);color:rgba(255,255,255,.6);cursor:pointer;transition:all var(--transition);white-space:nowrap;overflow:hidden;position:relative}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-item.active{background:var(--primary);color:#fff}
.nav-item .nav-icon{font-size:18px;flex-shrink:0}
.nav-item .nav-label{font-size:13px;font-weight:500;transition:opacity var(--transition)}
#sidebar.collapsed .nav-label{opacity:0;width:0}
#sidebar.collapsed .nav-item::after{content:attr(data-label);position:absolute;left:calc(100% + 12px);background:#1E293B;color:#fff;padding:5px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;box-shadow:var(--shadow)}
#sidebar.collapsed .nav-item:hover::after{opacity:1}
.sidebar-user{padding:12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:10px}
.user-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex-shrink:0}
.user-name{font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:11px;color:rgba(255,255,255,.4)}
#sidebar.collapsed .user-info{display:none}

/* MAIN */
#main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
#header{height:var(--header-h);background:var(--bg-card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;flex-shrink:0}
.header-title{font-size:15px;font-weight:600}
.header-spacer{flex:1}
.header-search{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 12px;width:220px}
.header-search input{border:none;background:none;outline:none;font-size:13px;color:var(--text);width:100%}
.header-search input::placeholder{color:var(--text-3)}
.header-actions{display:flex;align-items:center;gap:4px}
.header-btn{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:18px;position:relative;cursor:pointer}
.header-btn:hover{background:var(--bg);color:var(--text)}
.tenant-chip{display:flex;align-items:center;gap:6px;background:var(--primary-light);color:var(--primary);padding:5px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:600}
#main{flex:1;overflow-y:auto;padding:24px;background:var(--bg)}

/* AUTH */
.auth-card{background:#1E293B;border-radius:var(--radius-lg);border:1px solid rgba(255,255,255,.08);padding:40px;width:100%;max-width:420px;box-shadow:0 25px 50px rgba(0,0,0,.4)}
.auth-logo{display:flex;align-items:center;gap:12px;margin-bottom:32px}
.auth-logo .logo-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary));display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:800}
.auth-logo .logo-text{font-size:22px;font-weight:800;color:#fff}
.auth-logo .logo-sub{font-size:11px;color:rgba(255,255,255,.4)}
.auth-tabs{display:flex;gap:4px;background:rgba(255,255,255,.05);border-radius:var(--radius-sm);padding:4px;margin-bottom:28px}
.auth-tab{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:500;color:rgba(255,255,255,.5);transition:all var(--transition);text-align:center;cursor:pointer}
.auth-tab.active{background:var(--primary);color:#fff}
.auth-form{display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-label{font-size:12px;font-weight:500;color:rgba(255,255,255,.6)}
.form-input{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:var(--radius-sm);padding:10px 12px;color:#fff;font-size:14px;outline:none;transition:border-color var(--transition);width:100%}
.form-input:focus{border-color:var(--primary)}
.form-input::placeholder{color:rgba(255,255,255,.25)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;transition:all var(--transition);cursor:pointer;border:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-outline{background:transparent;color:var(--text);border:1px solid var(--border)}
.btn-outline:hover{background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-lg{padding:13px 20px;font-size:15px}
.btn-block{width:100%}
.btn-icon{padding:8px}
.btn i{font-size:16px}
.auth-link{text-align:center;font-size:13px;color:rgba(255,255,255,.4)}
.auth-link a{color:var(--primary);font-weight:500;cursor:pointer}
.auth-error{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);border-radius:var(--radius-sm);padding:10px 12px;color:#FCA5A5;font-size:13px;display:none}
.auth-error.show{display:block}
.auth-success{background:rgba(22,163,74,.15);border:1px solid rgba(22,163,74,.3);border-radius:var(--radius-sm);padding:10px 12px;color:#86EFAC;font-size:13px;display:none}
.auth-success.show{display:block}
.input-group{position:relative}
.input-group .form-input{padding-left:36px}
.input-group .input-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.3);font-size:16px;pointer-events:none}

/* COMPONENTS */
.card{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow-sm)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:700}
.page-subtitle{font-size:13px;color:var(--text-2);margin-top:2px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border-radius:var(--radius);border:1px solid var(--border);padding:18px;display:flex;align-items:flex-start;gap:14px}
.stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.stat-icon.blue{background:#EFF6FF;color:#2563EB}
.stat-icon.green{background:#F0FDF4;color:#16A34A}
.stat-icon.yellow{background:#FFFBEB;color:#D97706}
.stat-icon.red{background:#FEF2F2;color:#DC2626}
[data-theme="dark"] .stat-icon.blue{background:#1E3A5F}
[data-theme="dark"] .stat-icon.green{background:#14532D}
[data-theme="dark"] .stat-icon.yellow{background:#451A03}
[data-theme="dark"] .stat-icon.red{background:#450A0A}
.stat-value{font-size:22px;font-weight:700;line-height:1.2}
.stat-label{font-size:12px;color:var(--text-2);margin-top:2px}
.stat-trend{font-size:11px;margin-top:4px}
.stat-trend.up{color:var(--success)}
.stat-trend.down{color:var(--danger)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:600}
.badge-green{background:#DCFCE7;color:#15803D}
.badge-yellow{background:#FEF9C3;color:#854D0E}
.badge-red{background:#FEE2E2;color:#B91C1C}
.badge-blue{background:#DBEAFE;color:#1D4ED8}
.badge-gray{background:#F1F5F9;color:#475569}
[data-theme="dark"] .badge-green{background:#14532D;color:#86EFAC}
[data-theme="dark"] .badge-yellow{background:#451A03;color:#FDE68A}
[data-theme="dark"] .badge-red{background:#450A0A;color:#FCA5A5}
[data-theme="dark"] .badge-blue{background:#1E3A5F;color:#93C5FD}
[data-theme="dark"] .badge-gray{background:#1E293B;color:#94A3B8}
#toast-container{position:fixed;top:20px;right:20px;display:flex;flex-direction:column;gap:8px;z-index:9999;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;box-shadow:var(--shadow-lg);min-width:260px;max-width:360px;animation:toastIn .3s ease;pointer-events:all;font-size:13px}
.toast.removing{animation:toastOut .3s ease forwards}
.toast-icon{font-size:18px;flex-shrink:0}
.toast.success .toast-icon{color:var(--success)}
.toast.error .toast-icon{color:var(--danger)}
.toast.warning .toast-icon{color:var(--warning)}
.toast.info .toast-icon{color:var(--primary)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes toastOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:calc(100% + 4px);right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);min-width:160px;z-index:500;display:none;flex-direction:column;overflow:hidden}
.dropdown-menu.open{display:flex}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:13px;color:var(--text);cursor:pointer;transition:background var(--transition)}
.dropdown-item:hover{background:var(--bg)}
.dropdown-item.danger{color:var(--danger)}
.dropdown-divider{border-top:1px solid var(--border);margin:4px 0}
.spinner{width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner.dark{border-color:rgba(0,0,0,.1);border-top-color:var(--primary)}
@keyframes spin{to{transform:rotate(360deg)}}
.page-loading{display:flex;align-items:center;justify-content:center;height:200px;flex-direction:column;gap:12px;color:var(--text-3)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-3);text-align:center}
.empty-state i{font-size:48px;margin-bottom:12px;opacity:.4}
.empty-state h3{font-size:16px;font-weight:600;color:var(--text-2);margin-bottom:6px}
.empty-state p{font-size:13px}
.form-select{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 12px;color:var(--text);font-size:14px;outline:none;cursor:pointer;width:100%}
.chart-placeholder{height:200px;background:var(--bg);border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;color:var(--text-3);flex-direction:column;gap:8px}
table{width:100%;border-collapse:collapse}
thead th{text-align:left;padding:10px 12px;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-3);border-bottom:2px solid var(--border);white-space:nowrap}
tbody td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
</style>
</head>

        <button class="header-btn" onclick="toggleTheme()" title="Toggle tema"><i class="ti ti-moon" id="theme-icon"></i></button>
        <button class="header-btn" onclick="toggleLang()" title="Tukar bahasa"><i class="ti ti-language"></i></button>
        <div class="tenant-chip">
          <i class="ti ti-building"></i>
          <span id="tenant-name-header">-</span>
        </div>
        <div class="dropdown">
          <div class="user-avatar" style="width:32px;height:32px;font-size:12px;cursor:pointer" id="user-avatar-header" onclick="toggleUserDropdown()">U</div>
          <div class="dropdown-menu" id="user-dropdown">
            <div class="dropdown-item" onclick="openPage('settings')"><i class="ti ti-settings"></i> Settings</div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item danger" onclick="doLogout()"><i class="ti ti-logout"></i> Sign Out</div>
          </div>
        </div>
      </div>
    </header>
    <main id="main">
      <div class="page-loading"><div class="spinner dark"></div></div>
    </main>
  </div>
</div>

<script>
// CONFIG
const SUPABASE_URL  = 'https://wjqhhnjlgoigoagsnsen.supabase.co'
const SUPABASE_ANON = 'PASTE_ANON_KEY_KAMU_SINI'

const { createClient } = supabase
const sb = createClient(SUPABASE_URL, SUPABASE_ANON)

// GLOBAL STATE
const APP = {
  tenant:   { id:null, code:null, name:null, plan:null, config:{} },
  user:     { id:null, name:null, email:null, role:null, language:'en', theme:'light' },
  tenantConfig: { modules:{}, features:{}, roles:{} },
  language: 'en', theme: 'light', currentPage: null,
}

// LANG
const LANG = {
  en:{ tagline:'THE ERP THAT UNDERSTANDS YOUR BUSINESS', nav:{dashboard:'Dashboard',crm:'Customers',sales:'Sales',pos:'POS',inventory:'Inventory',accounting:'Accounting',reports:'Reports',settings:'Settings'}, common:{save:'Save',cancel:'Cancel',noData:'No data found'} },
  bm:{ tagline:'ERP YANG FAHAM BISNES KAU', nav:{dashboard:'Papan Pemuka',crm:'Pelanggan',sales:'Jualan',pos:'POS',inventory:'Inventori',accounting:'Perakaunan',reports:'Laporan',settings:'Tetapan'}, common:{save:'Simpan',cancel:'Batal',noData:'Tiada data ditemui'} }
}

// NAV
const NAV_ITEMS = [
  { section:'Main' },
  { id:'dashboard',  icon:'ti-layout-dashboard', label_en:'Dashboard',   label_bm:'Papan Pemuka', module:'core' },
  { section:'Operations' },
  { id:'crm',        icon:'ti-users',             label_en:'Customers',   label_bm:'Pelanggan',    module:'crm' },
  { id:'sales',      icon:'ti-file-invoice',      label_en:'Sales',       label_bm:'Jualan',       module:'sales' },
  { id:'pos',        icon:'ti-device-desktop',    label_en:'POS',         label_bm:'POS',          module:'pos' },
  { id:'inventory',  icon:'ti-box',               label_en:'Inventory',   label_bm:'Inventori',    module:'inventory' },
  { section:'Finance' },
  { id:'accounting', icon:'ti-calculator',        label_en:'Accounting',  label_bm:'Perakaunan',   module:'accounting' },
  { id:'reports',    icon:'ti-chart-bar',         label_en:'Reports',     label_bm:'Laporan',      module:'core' },
  { section:'System' },
  { id:'settings',   icon:'ti-settings',          label_en:'Settings',    label_bm:'Tetapan',      module:'core' },
]

// CORE FUNCTIONS
function canAccess(module) { return APP.user.role==='owner'||APP.user.role==='admin'||true }

function openPage(page, params={}) {
  APP.currentPage = page
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page))
  const item = NAV_ITEMS.find(n=>n.id===page)
  if(item) document.getElementById('header-title').textContent = APP.language==='bm'?item.label_bm:item.label_en
  const main = document.getElementById('main')
  main.innerHTML = '<div class="page-loading"><div class="spinner dark"></div></div>'
  setTimeout(()=>{
    switch(page){
      case 'dashboard':  renderDashboard(); break
      case 'crm':        renderComingSoon('Customers','ti-users'); break
      case 'sales':      renderComingSoon('Sales','ti-file-invoice'); break
      case 'pos':        renderComingSoon('POS','ti-device-desktop'); break
      case 'inventory':  renderComingSoon('Inventory','ti-box'); break
      case 'accounting': renderComingSoon('Accounting','ti-calculator'); break
      case 'reports':    renderComingSoon('Reports','ti-chart-bar'); break
      case 'settings':   renderSettings(); break
      default: main.innerHTML=`<div class="empty-state"><i class="ti ti-mood-confuzed"></i><h3>Page not found</h3></div>`
    }
  },150)
}

function formatRM(a) { return 'RM '+Number(a||0).toLocaleString('ms-MY',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function formatDate(d) { if(!d)return'-'; return new Date(d).toLocaleDateString('ms-MY',{day:'2-digit',month:'2-digit',year:'numeric'}) }
function validateIC(ic) { return /^\d{6}-\d{2}-\d{4}$/.test(ic) }
function validatePhone(p) { return /^\+601[0-9]-\d{7,8}$/.test(p) }

function showToast(msg,type='info') {
  const icons={success:'ti-check',error:'ti-x',warning:'ti-alert-triangle',info:'ti-info-circle'}
  const c=document.getElementById('toast-container')
  const t=document.createElement('div')
  t.className=`toast ${type}`
  t.innerHTML=`<i class="ti ${icons[type]||icons.info} toast-icon"></i><span>${msg}</span>`
  c.appendChild(t)
  setTimeout(()=>{ t.classList.add('removing'); setTimeout(()=>t.remove(),300) },3500)
}

function auditLog(action,table,id) { sb.rpc('log_audit',{p_action:action,p_table_name:table,p_record_id:String(id)}).catch(()=>{}) }

// AUTH
function switchAuthTab(tab) {
  document.getElementById('form-login').style.display    = tab==='login'    ?'block':'none'
  document.getElementById('form-register').style.display = tab==='register' ?'block':'none'
  document.getElementById('form-forgot').style.display   = tab==='forgot'   ?'block':'none'
  document.getElementById('tab-login').classList.toggle('active',tab==='login')
  document.getElementById('tab-register').classList.toggle('active',tab==='register')
}

function showForgotPassword() {
  document.getElementById('form-login').style.display='none'
  document.getElementById('form-forgot').style.display='block'
  document.getElementById('tab-login').classList.remove('active')
  document.getElementById('tab-register').classList.remove('active')
}

async function doLogin() {
  const email=document.getElementById('login-email').value.trim()
  const pass=document.getElementById('login-password').value
  const errEl=document.getElementById('login-error')
  const btn=document.getElementById('btn-login')
  errEl.classList.remove('show')
  if(!email||!pass){errEl.textContent='Please enter your email and password.';errEl.classList.add('show');return}
  btn.innerHTML='<div class="spinner"></div> Signing in...'
  btn.disabled=true
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass})
  btn.innerHTML='Sign In'
  btn.disabled=false
  if(error){errEl.textContent=error.message==='Invalid login credentials'?'Invalid email or password.':error.message;errEl.classList.add('show');return}
  await loadUserSession(data.user)
}

async function doRegister() {
  const name=document.getElementById('reg-name').value.trim()
  const company=document.getElementById('reg-company').value.trim()
  const email=document.getElementById('reg-email').value.trim()
  const pass=document.getElementById('reg-password').value
  const confirm=document.getElementById('reg-confirm').value
  const errEl=document.getElementById('register-error')
  const sucEl=document.getElementById('register-success')
  const btn=document.getElementById('btn-register')
  errEl.classList.remove('show');sucEl.classList.remove('show')
  if(!name||!company||!email||!pass){errEl.textContent='Please fill in all fields.';errEl.classList.add('show');return}
  if(pass.length<8){errEl.textContent='Password must be at least 8 characters.';errEl.classList.add('show');return}
  if(pass!==confirm){errEl.textContent='Passwords do not match.';errEl.classList.add('show');return}
  btn.innerHTML='<div class="spinner"></div> Mendaftar...'
  btn.disabled=true
  const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name,company_name:company}}})
  btn.innerHTML='Create Account'
  btn.disabled=false
  if(error){errEl.textContent=error.message;errEl.classList.add('show');return}
  sucEl.textContent='✓ Account created! Please check your email to verify.'
  sucEl.classList.add('show')
}

async function doForgotPassword() {
  const email=document.getElementById('forgot-email').value.trim()
  if(!email)return
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:`${window.location.origin}?reset=true`})
  if(error){showToast(error.message,'error');return}
  document.getElementById('forgot-msg').textContent='✓ Reset link sent to your email.'
  document.getElementById('forgot-msg').classList.add('show')
}

async function doLogout() {
  await sb.auth.signOut()
  showAuthPage()
  showToast('You have been signed out.','info')
}

// SESSION
async function loadUserSession(user) {
  if(!user){showAuthPage();return}
  APP.user.id=user.id
  APP.user.email=user.email
  const {data:profile}=await sb.from('user_profiles').select('*,tenants(*)').eq('id',user.id).single()
  if(!profile){showAuthPage();showToast('Profile not found. Please contact admin.','error');return}
  APP.user.name=profile.full_name
  APP.user.role=profile.role
  APP.language=profile.language||'en'
  APP.theme=profile.theme||'light'
  if(profile.tenants){APP.tenant.id=profile.tenants.id;APP.tenant.code=profile.tenants.code;APP.tenant.name=profile.tenants.name}
  applyTheme(APP.theme)
  showShell()
}

// SHELL UI
function showAuthPage() {
  document.getElementById('auth-page').style.display='flex'
  document.getElementById('shell').classList.remove('active')
}

function showShell() {
  document.getElementById('auth-page').style.display='none'
  document.getElementById('shell').classList.add('active')
  buildSidebar()
  updateUserUI()
  openPage('dashboard')
}

function buildSidebar() {
  const nav=document.getElementById('sidebar-nav')
  nav.innerHTML=''
  NAV_ITEMS.forEach(item=>{
    if(item.section){const s=document.createElement('div');s.className='nav-section';s.textContent=item.section;nav.appendChild(s);return}
    const label=APP.language==='bm'?item.label_bm:item.label_en
    const el=document.createElement('div')
    el.className='nav-item'
    el.dataset.page=item.id
    el.dataset.label=label
    el.innerHTML=`<i class="ti ${item.icon} nav-icon"></i><span class="nav-label">${label}</span>`
    el.onclick=()=>openPage(item.id)
    nav.appendChild(el)
  })
}

function updateUserUI() {
  const init=(APP.user.name||'U').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()
  document.getElementById('user-avatar-sidebar').textContent=init
  document.getElementById('user-avatar-header').textContent=init
  document.getElementById('user-name-sidebar').textContent=APP.user.name||'-'
  document.getElementById('user-role-sidebar').textContent=APP.user.role||'-'
  document.getElementById('tenant-name-header').textContent=APP.tenant.name||'-'
}

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed') }
function toggleTheme() { applyTheme(APP.theme==='light'?'dark':'light') }
function applyTheme(t) { APP.theme=t;document.documentElement.dataset.theme=t;document.getElementById('theme-icon').className=t==='dark'?'ti ti-sun':'ti ti-moon' }
function toggleLang() {
  APP.language=APP.language==='en'?'bm':'en'
  const tagline = LANG[APP.language].tagline
  const authTag = document.getElementById('auth-tagline')
  if(authTag) authTag.textContent = tagline
  buildSidebar()
  openPage(APP.currentPage||'dashboard')
  showToast(APP.language==='bm'?'Bahasa ditukar ke Melayu':'Language changed to English','info')
}
function toggleUserDropdown() { document.getElementById('user-dropdown').classList.toggle('open') }

document.addEventListener('click',e=>{ if(!e.target.closest('.dropdown'))document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.remove('open')) })
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&document.getElementById('form-login').style.display!=='none')doLogin() })

// PAGES
function renderDashboard() {
  document.getElementById('main').innerHTML=`
  <div class="page-header">
    <div><div class="page-title">Dashboard</div><div class="page-subtitle">Welcome back, ${APP.user.name||''}! 👋</div></div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-outline btn-sm"><i class="ti ti-calendar"></i> ${new Date().toLocaleDateString('ms-MY',{month:'long',year:'numeric'})}</button>
      <button class="btn btn-primary btn-sm"><i class="ti ti-download"></i> Eksport</button>
    </div>
  </div>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-icon blue"><i class="ti ti-currency-dollar"></i></div><div><div class="stat-value" id="st-sales">RM 0.00</div><div class="stat-label">Total Sales</div><div class="stat-trend up"><i class="ti ti-trending-up"></i> This month</div></div></div>
    <div class="stat-card"><div class="stat-icon yellow"><i class="ti ti-file-invoice"></i></div><div><div class="stat-value" id="st-inv">RM 0.00</div><div class="stat-label">Outstanding Invoices</div><div class="stat-trend" style="color:var(--text-3)">0 invoices</div></div></div>
    <div class="stat-card"><div class="stat-icon green"><i class="ti ti-users"></i></div><div><div class="stat-value" id="st-cust">0</div><div class="stat-label">Total Customers</div><div class="stat-trend up">Active</div></div></div>
    <div class="stat-card"><div class="stat-icon red"><i class="ti ti-alert-triangle"></i></div><div><div class="stat-value" id="st-stock">0</div><div class="stat-label">Low Stock</div><div class="stat-trend down">Needs attention</div></div></div>
  </div>
  <div style="display:grid;grid-template-columns:2fr 1fr;gap:16px">
    <div class="card"><div class="card-header"><div class="card-title">Monthly Sales</div></div><div class="chart-placeholder"><i class="ti ti-chart-bar" style="font-size:36px"></i><span style="font-size:13px">Will load with Chart.js</span></div></div>
    <div class="card"><div class="card-header"><div class="card-title">Recent Invoices</div><button class="btn btn-outline btn-sm" onclick="openPage('sales')">View All</button></div><div id="recent-inv"><div class="empty-state" style="padding:30px"><i class="ti ti-file-off"></i><p>No invoices yet</p></div></div></div>
  </div>`
  loadDashboardData()
}

async function loadDashboardData() {
  if(!APP.tenant.id)return
  const start=new Date();start.setDate(1);start.setHours(0,0,0,0)
  const {data:inv}=await sb.from('invoices').select('total,status,ref_no,customer_name,issue_date').eq('tenant_id',APP.tenant.id).is('deleted_at',null).gte('issue_date',start.toISOString().slice(0,10)).order('issue_date',{ascending:false}).limit(5)
  if(inv){
    const el=document.getElementById('st-sales');if(el)el.textContent=formatRM(inv.reduce((s,i)=>s+(i.total||0),0))
    const out=inv.filter(i=>['issued','partial','overdue'].includes(i.status))
    const oel=document.getElementById('st-inv');if(oel)oel.textContent=formatRM(out.reduce((s,i)=>s+(i.total||0),0))
    if(inv.length>0){
      const rInv=document.getElementById('recent-inv')
      if(rInv)rInv.innerHTML=`<table><thead><tr><th>Ref</th><th>Customer</th><th>Amount</th><th>Status</th></tr></thead><tbody>${inv.map(i=>`<tr><td style="font-size:11px">${i.ref_no}</td><td>${i.customer_name||'-'}</td><td>${formatRM(i.total)}</td><td><span class="badge ${i.status==='paid'?'badge-green':i.status==='overdue'?'badge-red':'badge-yellow'}">${i.status}</span></td></tr>`).join('')}</tbody></table>`
    }
  }
  const {count:cc}=await sb.from('customers').select('id',{count:'exact',head:true}).eq('tenant_id',APP.tenant.id).is('deleted_at',null)
  const cel=document.getElementById('st-cust');if(cel&&cc!=null)cel.textContent=cc
}

function renderSettings() {
  document.getElementById('main').innerHTML=`
  <div class="page-header"><div class="page-title">Settings</div></div>
  <div class="card" style="max-width:500px">
    <div class="card-header"><div class="card-title">My Account</div></div>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="form-group"><label class="form-label" style="color:var(--text-2)">Name</label><input type="text" class="form-select" value="${APP.user.name||''}" readonly></div>
      <div class="form-group"><label class="form-label" style="color:var(--text-2)">Email</label><input type="text" class="form-select" value="${APP.user.email||''}" readonly></div>
      <div class="form-group"><label class="form-label" style="color:var(--text-2)">Role</label><input type="text" class="form-select" value="${APP.user.role||''}" readonly></div>
      <div class="form-group"><label class="form-label" style="color:var(--text-2)">Company</label><input type="text" class="form-select" value="${APP.tenant.name||''}" readonly></div>
      <button class="btn btn-danger" style="width:fit-content" onclick="doLogout()"><i class="ti ti-logout"></i> Sign Out</button>
    </div>
  </div>`
}

function renderComingSoon(title,icon) {
  document.getElementById('main').innerHTML=`
  <div class="page-header"><div class="page-title">${title}</div></div>
  <div class="card"><div class="empty-state" style="padding:80px">
    <i class="ti ${icon}" style="font-size:64px;opacity:.2"></i>
    <h3>Under Development</h3>
    <p>Modul ${title} will be available soon.</p>
    <button class="btn btn-primary" style="margin-top:16px" onclick="openPage('dashboard')">Back to Dashboard</button>
  </div></div>`
}

// INIT
async function init() {
  const {data:{session}}=await sb.auth.getSession()
  if(session?.user) await loadUserSession(session.user)
  else showAuthPage()
  sb.auth.onAuthStateChange(async(event,session)=>{
    if(event==='SIGNED_IN'&&session?.user) await loadUserSession(session.user)
    else if(event==='SIGNED_OUT') showAuthPage()
  })
}

init()
</script>
</body>
</html>
