<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark" id="dkp-color-scheme">
<title>Delivery Order</title>
<script>
/* Lock to ?theme=light|dark from Share URL (sharer's app data-theme). Else OS prefers-color-scheme. */
(function(){
  try{
    var t=new URLSearchParams(location.search).get('theme');
    if(t!=='light'&&t!=='dark') return;
    document.documentElement.setAttribute('data-theme',t);
    var m=document.getElementById('dkp-color-scheme'); if(m) m.setAttribute('content',t);
    try{document.documentElement.style.colorScheme=t}catch(e){}
  }catch(e){}
})();
</script>
<style>
  :root{
    --psd-bg:#F1F5F9;
    --psd-surface:#fff;
    --psd-border:#e2e8f0;
    --psd-text:#0f172a;
    --psd-muted:#334155;
    --psd-muted-2:#475569;
    --psd-primary:#0E7490;
    --psd-conf-bg:#fef3c7;
    --psd-conf-border:#d97706;
    --psd-conf-text:#78350f;
    --psd-shadow:0 4px 20px rgba(0,0,0,.06);
    --psd-card-bg:#fff;
    --psd-row-border:#e2e8f0;
    --psd-input-bg:#fff;
    --psd-btn-bg:#fff;
    --psd-danger:#991b1b;
    --psd-ok:#166534;
    --psd-on-primary:#fff;
  }
  /* OS dark only when theme not locked via ?theme= */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme]){
      --psd-bg:#0b1220;
      --psd-surface:#111827;
      --psd-border:#1f2937;
      --psd-text:#f1f5f9;
      --psd-muted:#94a3b8;
      --psd-muted-2:#94a3b8;
      --psd-primary:#2dd4bf;
      --psd-conf-bg:#fbbf24;
      --psd-conf-border:#d97706;
      --psd-conf-text:#111827;
      --psd-shadow:0 4px 20px rgba(0,0,0,.35);
      --psd-card-bg:#1e293b;
      --psd-row-border:#334155;
      --psd-input-bg:#0f172a;
      --psd-btn-bg:#1e293b;
      --psd-danger:#fca5a5;
      --psd-ok:#86efac;
      --psd-on-primary:#0b1220;
    }
  }
  html[data-theme="dark"]{
    color-scheme:dark;
    --psd-bg:#0b1220;
    --psd-surface:#111827;
    --psd-border:#1f2937;
    --psd-text:#f1f5f9;
    --psd-muted:#94a3b8;
    --psd-muted-2:#94a3b8;
    --psd-primary:#2dd4bf;
    --psd-conf-bg:#fbbf24;
    --psd-conf-border:#d97706;
    --psd-conf-text:#111827;
    --psd-shadow:0 4px 20px rgba(0,0,0,.35);
    --psd-card-bg:#1e293b;
    --psd-row-border:#334155;
    --psd-input-bg:#0f172a;
    --psd-btn-bg:#1e293b;
    --psd-danger:#fca5a5;
    --psd-ok:#86efac;
    --psd-on-primary:#0b1220;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --psd-bg:#F1F5F9;
    --psd-surface:#fff;
    --psd-border:#e2e8f0;
    --psd-text:#0f172a;
    --psd-muted:#334155;
    --psd-muted-2:#475569;
    --psd-primary:#0E7490;
    --psd-conf-bg:#fef3c7;
    --psd-conf-border:#d97706;
    --psd-conf-text:#78350f;
    --psd-shadow:0 4px 20px rgba(0,0,0,.06);
    --psd-card-bg:#fff;
    --psd-row-border:#e2e8f0;
    --psd-input-bg:#fff;
    --psd-btn-bg:#fff;
    --psd-danger:#991b1b;
    --psd-ok:#166534;
    --psd-on-primary:#fff;
  }
  html,body{margin:0;min-height:100%;background:var(--psd-bg);color:var(--psd-text);font-family:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  .wrap{max-width:640px;margin:12px auto 48px;padding:20px 16px 28px;background:var(--psd-surface);border:1px solid var(--psd-border);border-radius:14px;box-shadow:var(--psd-shadow);overflow:hidden}
  .co{display:flex;gap:12px;align-items:center;min-width:0}.co img{max-height:44px;max-width:96px;object-fit:contain;background:#fff;border-radius:6px}
  .co b{display:block;font-size:17px;color:var(--psd-primary);overflow-wrap:anywhere}.co small{display:block;font-size:12px;color:var(--psd-muted-2);overflow-wrap:anywhere}
  .ttl{margin:16px 0 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .ttl h1{margin:0;font-size:20px;color:var(--psd-text)}.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--psd-border);color:var(--psd-muted);white-space:nowrap}
  .chip.ok{color:var(--psd-ok);border-color:var(--psd-ok)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .kv div{background:var(--psd-card-bg);border:1px solid var(--psd-row-border);border-radius:10px;padding:8px 10px;min-width:0}
  .kv span{display:block;font-size:11px;color:var(--psd-muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.kv b{display:block;font-size:14px;overflow-wrap:anywhere;margin-top:2px}
  .lb{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--psd-muted-2);margin:16px 0 6px}
  .it{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--psd-row-border);font-size:14px}.it:first-child{border-top:0}
  .it span{overflow-wrap:anywhere;min-width:0}.it b{white-space:nowrap}
  .items{border:1px solid var(--psd-row-border);border-radius:10px;overflow:hidden}
  .box{margin-top:18px;padding:16px 14px;border:1px solid var(--psd-border);border-radius:12px;background:var(--psd-card-bg)}
  .box label{display:block;font-size:13px;font-weight:700;color:var(--psd-muted);margin-top:8px}
  .box input,.box textarea{display:block;width:100%;margin:4px 0 6px;padding:10px;border:1px solid var(--psd-border);border-radius:8px;font:inherit;font-size:15px;color:var(--psd-text);background:var(--psd-input-bg)}
  .box textarea{min-height:70px;resize:vertical}
  .btn{min-height:44px;padding:10px 16px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;border:0;background:var(--psd-primary);color:var(--psd-on-primary);width:100%;margin-top:8px}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.55;cursor:not-allowed}
  .err{display:none;color:var(--psd-danger);font-size:14px;font-weight:600;margin:8px 0 0}
  .ok{font-size:15px;font-weight:700;color:var(--psd-ok)}
  .sub{font-size:13px;color:var(--psd-muted-2);margin:4px 0 0}
  .lang{display:flex;justify-content:flex-end;gap:6px;margin:0 auto;max-width:640px;padding:8px 16px 0}
  .lang a{font-size:12px;font-weight:700;color:var(--psd-muted);text-decoration:none;padding:4px 10px;border:1px solid var(--psd-border);border-radius:999px;white-space:nowrap}
  .lang a.on{color:var(--psd-primary);border-color:var(--psd-primary)}
  .foot{margin-top:18px;font-size:11px;color:var(--psd-muted-2);text-align:center}
  .msg{max-width:560px;margin:60px auto;padding:24px;background:var(--psd-surface);border-radius:12px;border:1px solid var(--psd-border);text-align:center}
  @media (max-width:520px){.wrap{margin:8px 8px 40px;border-radius:12px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="root"><div class="msg">Loading…</div></div>
<script>
const SUPABASE_URL='https://wjqhhnjlgoigoagsnsen.supabase.co'
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcWhobmpsZ29pZ29hZ3Nuc2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTU1NTMsImV4cCI6MjA5NTM3MTU1M30.FWLOZEV47hg5H5b4XKU1Wbiutv8Z3GbagS-aLbHmhaw'
window.sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})
</script>
<script>
/* dk-public.html?public_do=<token>[&lang=bm] — customer views a delivery order and confirms receipt (dk_phase1_sales.sql) */
(function(){
  var qs=new URLSearchParams(location.search), tok=qs.get('public_do')||'', bm=qs.get('lang')==='bm';
  var root=document.getElementById('root');
  function L(en,b){return bm?b:en}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function dt(s,t){if(!s)return '-';var d=new Date(s);if(isNaN(d))return String(s);return d.toLocaleDateString(bm?'ms-MY':'en-MY',{day:'2-digit',month:'short',year:'numeric'})+(t?' '+d.toLocaleTimeString(bm?'ms-MY':'en-MY',{hour:'2-digit',minute:'2-digit'}):'')}
  var ST={pending:['Pending','Menunggu'],in_transit:['On the way','Dalam perjalanan'],out_for_delivery:['Out for delivery','Sedang dihantar'],delivered:['Delivered','Dihantar'],cancelled:['Cancelled','Dibatalkan'],failed:['Failed','Gagal']};
  function st(s){var x=ST[s];return x?L(x[0],x[1]):(s||'-')}
  function langBar(){var u=function(b){var q=new URLSearchParams(location.search);if(b)q.set('lang','bm');else q.delete('lang');return '?'+q.toString()};
    return '<div class="lang"><a href="'+u(0)+'" class="'+(bm?'':'on')+'">EN</a><a href="'+u(1)+'" class="'+(bm?'on':'')+'">BM</a></div>'}
  function msg(t){root.innerHTML=langBar()+'<div class="msg">'+esc(t)+'</div>'}
  document.documentElement.lang=bm?'ms':'en';
  if(!tok||tok.length<16){msg(L('This link is invalid or has expired.','Pautan ini tidak sah atau telah tamat tempoh.'));return}
  function render(r){
    var c=r.company||{}, d=r.do||{}, items=r.items||[], done=!!d.received_at;
    document.title=(d.no||'DO')+' · '+(c.name||'');
    var h=langBar()+'<div class="wrap"><div class="co">'+(c.logo?'<img src="'+esc(c.logo)+'" alt="">':'')+'<div><b>'+esc(c.name||'')+'</b>'+(c.address?'<small>'+esc(c.address)+'</small>':'')+(c.phone?'<small>'+esc(c.phone)+'</small>':'')+'</div></div>';
    h+='<div class="ttl"><h1>'+esc(L('Delivery Order','Pesanan Penghantaran'))+' '+esc(d.no||'')+'</h1><span class="chip'+(done||d.status==='delivered'?' ok':'')+'">'+esc(st(done?'delivered':d.status))+'</span></div>';
    h+='<div class="kv"><div><span>'+esc(L('Date','Tarikh'))+'</span><b>'+esc(dt(d.date))+'</b></div><div><span>'+esc(L('Customer','Pelanggan'))+'</span><b>'+esc(d.customer||'-')+'</b></div>'+
      (d.invoice?'<div><span>'+esc(L('Invoice','Invois'))+'</span><b>'+esc(d.invoice)+'</b></div>':'')+(d.driver?'<div><span>'+esc(L('Driver','Pemandu'))+'</span><b>'+esc(d.driver)+(d.vehicle?' · '+esc(d.vehicle):'')+'</b></div>':'')+'</div>';
    if(d.address) h+='<div class="lb">'+esc(L('Deliver to','Hantar ke'))+'</div><div class="sub" style="white-space:pre-line;color:var(--psd-text)">'+esc(d.address)+'</div>';
    h+='<div class="lb">'+esc(L('Items','Item'))+'</div><div class="items">'+(items.length?items.map(function(i){return '<div class="it"><span>'+esc(i.d||'-')+'</span><b>× '+esc(i.q==null?'-':i.q)+'</b></div>'}).join(''):'<div class="it"><span class="sub">'+esc(L('No item list on this delivery order.','Tiada senarai item pada pesanan ini.'))+'</span></div>')+'</div>';
    if(d.notes) h+='<div class="lb">'+esc(L('Notes','Nota'))+'</div><div class="sub" style="white-space:pre-wrap">'+esc(d.notes)+'</div>';
    h+='<div class="box" id="dkp-box">';
    if(done) h+='<div class="ok">✓ '+esc(L('Received','Diterima'))+'</div><div class="sub">'+esc(L('Confirmed by ','Disahkan oleh ')+(d.received_by||'-')+' · '+dt(d.received_at,1))+'</div>';
    else if(d.status==='cancelled') h+='<div class="sub">'+esc(L('This delivery order was cancelled.','Pesanan penghantaran ini telah dibatalkan.'))+'</div>';
    else h+='<b>'+esc(L('Confirm you received the goods','Sahkan anda telah menerima barang'))+'</b><div class="sub">'+esc(L('Check the items above, then type your name to confirm.','Semak item di atas, kemudian taip nama anda untuk mengesahkan.'))+'</div>'+
      '<label for="dkp-n">'+esc(L('Your name','Nama anda'))+'</label><input id="dkp-n" maxlength="120" autocomplete="name">'+
      '<label for="dkp-t">'+esc(L('Note (optional)','Nota (pilihan)'))+'</label><textarea id="dkp-t" maxlength="500" placeholder="'+esc(L('e.g. 1 box damaged','cth. 1 kotak rosak'))+'"></textarea>'+
      '<div class="err" id="dkp-e"></div><button class="btn" id="dkp-b" type="button">'+esc(L('Confirm received','Sahkan diterima'))+'</button>';
    h+='</div><div class="foot">'+esc(L('Shared securely by ','Dikongsi dengan selamat oleh ')+(c.name||'M-Core'))+'</div></div>';
    root.innerHTML=h;
    var b=document.getElementById('dkp-b'); if(!b) return;
    b.onclick=function(){
      var n=document.getElementById('dkp-n').value.trim(), t=document.getElementById('dkp-t').value.trim(), e=document.getElementById('dkp-e');
      e.style.display='none';
      if(n.length<2){e.textContent=L('Please type your name.','Sila taip nama anda.');e.style.display='block';return}
      b.disabled=true;b.textContent=L('Confirming…','Mengesahkan…');
      sb.rpc('public_do_confirm',{p_token:tok,p_name:n,p_note:t||null}).then(function(x){
        var r2=x.data||{};
        if(x.error||!r2.ok){var k=(r2&&r2.error)||'';e.textContent=k==='rate'?L('Too many attempts. Please try again later.','Terlalu banyak cubaan. Sila cuba sebentar lagi.'):k==='name'?L('Please type your name.','Sila taip nama anda.'):L('Could not confirm. Please try again.','Tidak dapat disahkan. Sila cuba lagi.');e.style.display='block';b.disabled=false;b.textContent=L('Confirm received','Sahkan diterima');return}
        d.received_at=r2.received_at||new Date().toISOString();d.received_by=r2.received_by||n;d.status='delivered';render(r);
      },function(){e.textContent=L('Network error. Please try again.','Ralat rangkaian. Sila cuba lagi.');e.style.display='block';b.disabled=false;b.textContent=L('Confirm received','Sahkan diterima')});
    };
  }
  sb.rpc('get_public_do',{p_token:tok}).then(function(x){
    if(x.error||!x.data||!x.data.ok){msg(L('This link is invalid or has expired.','Pautan ini tidak sah atau telah tamat tempoh.'));return}
    render(x.data);
  },function(){msg(L('Network error. Please refresh.','Ralat rangkaian. Sila muat semula.'))});
})();
</script>
</body>
</html>
