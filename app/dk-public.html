<script>
/* Lock to ?theme=light|dark from Share URL (sharer's app data-theme). Else OS prefers-color-scheme. */
(function(){
  try{
    var t=new URLSearchParams(location.search).get('theme');
    if(t!=='light'&&t!=='dark') return;
    document.documentElement.setAttribute('data-theme',t);
    var m=document.getElementById('dkp-color-scheme'); if(m) m.setAttribute('content',t);
    try{document.documentElement.style.colorScheme=t}catch(e){}
  }catch(e){}
})();
</script>
<style>

    --psd-surface:#fff;
    --psd-border:#e2e8f0;
    --psd-text:#0f172a;
    --psd-muted:#334155;
    --psd-muted-2:#475569;

    --psd-btn-bg:#fff;
    --psd-danger:#991b1b;
    --psd-ok:#166534;

  }

    :root:not([data-theme]){
      --psd-bg:#0b1220;

      --psd-card-bg:#1e293b;
      --psd-row-border:#334155;
      --psd-input-bg:#0f172a;
      --psd-btn-bg:#1e293b;
      --psd-danger:#fca5a5;

      --psd-on-primary:#0b1220;

  }

    --psd-conf-text:#111827;
    --psd-shadow:0 4px 20px rgba(0,0,0,.35);
    --psd-card-bg:#1e293b;
    --psd-row-border:#334155;
    --psd-input-bg:#0f172a;
    --psd-btn-bg:#1e293b;
    --psd-danger:#fca5a5;
    --psd-ok:#86efac;
    --psd-on-primary:#0b1220;
  }
  html[data-theme="light"]{
    color-scheme:light;
    --psd-bg:#F1F5F9;
    --psd-surface:#fff;
    --psd-border:#e2e8f0;

  }
  html,body{margin:0;min-height:100%;background:var(--psd-bg);color:var(--psd-text);font-family:Inter,system-ui,sans-serif}
  *{box-sizing:border-box}
  .wrap{max-width:640px;margin:12px auto 48px;padding:20px 16px 28px;background:var(--psd-surface);border:1px solid var(--psd-border);border-radius:14px;box-shadow:var(--psd-shadow);overflow:hidden}
  .co{display:flex;gap:12px;align-items:center;min-width:0}.co img{max-height:44px;max-width:96px;object-fit:contain;background:#fff;border-radius:6px}
  .co b{display:block;font-size:17px;color:var(--psd-primary);overflow-wrap:anywhere}.co small{display:block;font-size:12px;color:var(--psd-muted-2);overflow-wrap:anywhere}
  .ttl{margin:16px 0 4px;display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .ttl h1{margin:0;font-size:20px;color:var(--psd-text)}.chip{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--psd-border);color:var(--psd-muted);white-space:nowrap}
  .chip.ok{color:var(--psd-ok);border-color:var(--psd-ok)}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:12px 0}
  .kv div{background:var(--psd-card-bg);border:1px solid var(--psd-row-border);border-radius:10px;padding:8px 10px;min-width:0}
  .kv span{display:block;font-size:11px;color:var(--psd-muted-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.kv b{display:block;font-size:14px;overflow-wrap:anywhere;margin-top:2px}
  .lb{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--psd-muted-2);margin:16px 0 6px}
  .it{display:flex;justify-content:space-between;gap:12px;padding:9px 12px;border-top:1px solid var(--psd-row-border);font-size:14px}.it:first-child{border-top:0}
  .it span{overflow-wrap:anywhere;min-width:0}.it b{white-space:nowrap}
  .items{border:1px solid var(--psd-row-border);border-radius:10px;overflow:hidden}
  .box{margin-top:18px;padding:16px 14px;border:1px solid var(--psd-border);border-radius:12px;background:var(--psd-card-bg)}
  .box label{display:block;font-size:13px;font-weight:700;color:var(--psd-muted);margin-top:8px}
  .box input,.box textarea{display:block;width:100%;margin:4px 0 6px;padding:10px;border:1px solid var(--psd-border);border-radius:8px;font:inherit;font-size:15px;color:var(--psd-text);background:var(--psd-input-bg)}
  .box textarea{min-height:70px;resize:vertical}
  .btn{min-height:44px;padding:10px 16px;border-radius:10px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap;border:0;background:var(--psd-primary);color:var(--psd-on-primary);width:100%;margin-top:8px}
  .btn:hover{filter:brightness(1.06)}.btn:active{transform:translateY(1px)}.btn:disabled{opacity:.55;cursor:not-allowed}
  .err{display:none;color:var(--psd-danger);font-size:14px;font-weight:600;margin:8px 0 0}
  .ok{font-size:15px;font-weight:700;color:var(--psd-ok)}
  .sub{font-size:13px;color:var(--psd-muted-2);margin:4px 0 0}
  .lang{display:flex;justify-content:flex-end;gap:6px;margin:0 auto;max-width:640px;padding:8px 16px 0}
  .lang a{font-size:12px;font-weight:700;color:var(--psd-muted);text-decoration:none;padding:4px 10px;border:1px solid var(--psd-border);border-radius:999px;white-space:nowrap}
  .lang a.on{color:var(--psd-primary);border-color:var(--psd-primary)}
  .foot{margin-top:18px;font-size:11px;color:var(--psd-muted-2);text-align:center}
  .msg{max-width:560px;margin:60px auto;padding:24px;background:var(--psd-surface);border-radius:12px;border:1px solid var(--psd-border);text-align:center}
  .pad{display:block;width:100%;height:170px;margin:4px 0 4px;border:1px solid var(--psd-border);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
  .padrow{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--psd-muted-2)}
  .lnk{background:none;border:0;padding:6px 0;font:inherit;font-size:13px;font-weight:700;color:var(--psd-primary);cursor:pointer;white-space:nowrap}
  .sigs{border:1px solid var(--psd-row-border);border-radius:10px;overflow:hidden}
  .sg{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--psd-row-border);font-size:14px}.sg:first-child{border-top:0}
  .sg div{min-width:0}.sg b{display:block;font-size:13px}.sg small{display:block;font-size:12px;color:var(--psd-muted-2);overflow-wrap:anywhere}
  .chip.wait{color:#b45309;border-color:#d97706}
  @media (max-width:520px){.wrap{margin:8px 8px 40px;border-radius:12px}}
</style>

<div id="root"><div class="msg">Loading…</div></div>
<script>
const SUPABASE_URL='https://wjqhhnjlgoigoagsnsen.supabase.co'
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndqcWhobmpsZ29pZ29hZ3Nuc2VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTU1NTMsImV4cCI6MjA5NTM3MTU1M30.FWLOZEV47hg5H5b4XKU1Wbiutv8Z3GbagS-aLbHmhaw'

<script>
/* dk-public.html?public_do=<token>[&lang=bm] — customer views a delivery order and signs "Received by" (DO confirm link, doc_public_links)
   dk-public.html?do_sign=<token>[&lang=bm]   — per-slot DO sign link, e.g. "Delivered by" (dk_do_sign_links)
   Draw pad -> PNG in doc-files {tenant}/do-sign/{sha256(token)}/… -> public_do_confirm / public_do_sign (20261128120000_do_sign_pv_style.sql).
   Signing never changes the DO status (stays manual in the app). Falls back to the typed-name confirm when that SQL is not run yet. */
(function(){
  var qs=new URLSearchParams(location.search), signTok=qs.get('do_sign')||'', tok=signTok||qs.get('public_do')||'', mode=signTok?'sign':'confirm', bm=qs.get('lang')==='bm';
  var root=document.getElementById('root'), pad=null;
  function L(en,b){return bm?b:en}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function dt(s,t){if(!s)return '-';var d=new Date(s);if(isNaN(d))return String(s);return d.toLocaleDateString(bm?'ms-MY':'en-MY',{day:'2-digit',month:'short',year:'numeric'})+(t?' '+d.toLocaleTimeString(bm?'ms-MY':'en-MY',{hour:'2-digit',minute:'2-digit'}):'')}
  var ST={pending:['Pending','Menunggu'],in_transit:['On the way','Dalam perjalanan'],out_for_delivery:['Out for delivery','Sedang dihantar'],delivered:['Delivered','Dihantar'],cancelled:['Cancelled','Dibatalkan'],failed:['Failed','Gagal']};
  function st(s){var x=ST[s];return x?L(x[0],x[1]):(s||'-')}
  function langBar(){var u=function(b){var q=new URLSearchParams(location.search);if(b)q.set('lang','bm');else q.delete('lang');return '?'+q.toString()};
    return '<div class="lang"><a href="'+u(0)+'" class="'+(bm?'':'on')+'">EN</a><a href="'+u(1)+'" class="'+(bm?'on':'')+'">BM</a></div>'}
  function msg(t){root.innerHTML=langBar()+'<div class="msg">'+esc(t)+'</div>'}
  document.documentElement.lang=bm?'ms':'en';
  if(!tok||tok.length<16){msg(L('This link is invalid or has expired.','Pautan ini tidak sah atau telah tamat tempoh.'));return}
  function slotLbl(x){return x?(bm?x.label_bm:x.label_en):''}
  /* ---- pad (same feel as the PV public pad) ---- */
  function initPad(cv){
    var r=cv.getBoundingClientRect(),dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
    var w=Math.max(240,Math.round(r.width||400)),h=Math.max(120,Math.round(r.height||170));
    cv.width=w*dpr;cv.height=h*dpr;var c=cv.getContext('2d');if(!c)return;c.scale(dpr,dpr);
    pad={cv:cv,c:c,ink:false,down:false};clearPad();
    function pt(e){var b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*(w/(b.width||w)),y:(e.clientY-b.top)*(h/(b.height||h))}}
    cv.addEventListener('pointerdown',function(e){e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(x){}pad.down=true;var p=pt(e);c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x+.1,p.y+.1);c.stroke();pad.ink=true});
    cv.addEventListener('pointermove',function(e){if(!pad||!pad.down)return;e.preventDefault();var p=pt(e);c.lineTo(p.x,p.y);c.stroke()});
    var up=function(){if(pad)pad.down=false};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('pointerleave',up);
  }
  function clearPad(){if(!pad)return;var c=pad.c;c.save();c.setTransform(1,0,0,1,0,0);c.fillStyle='#fff';c.fillRect(0,0,pad.cv.width,pad.cv.height);c.restore();c.strokeStyle='#000';c.lineWidth=2.5;c.lineCap='round';c.lineJoin='round';pad.ink=false}
  function padBlob(){return new Promise(function(res){pad.cv.toBlob(function(b){res(b)},'image/png')})}
  function render(r){
    var c=r.company||{}, d=r.do||{}, items=r.items||[], sigs=r.sigs||[], slot=r.slot||'received', canPad=!!(r.tid&&r.hash);
    var me=sigs.filter(function(x){return x.slot===slot})[0]||null, mine=me?!!me.signed_at:(slot==='received'&&!!d.received_at);
    var lbl=me?slotLbl(me):(slot==='received'?L('Received by','Diterima oleh'):L('Delivered by','Dihantar oleh'));
    document.title=(d.no||'DO')+' · '+(c.name||'');
    var h=langBar()+'<div class="wrap"><div class="co">'+(c.logo?'<img src="'+esc(c.logo)+'" alt="">':'')+'<div><b>'+esc(c.name||'')+'</b>'+(c.address?'<small>'+esc(c.address)+'</small>':'')+(c.phone?'<small>'+esc(c.phone)+'</small>':'')+'</div></div>';
    h+='<div class="ttl"><h1>'+esc(L('Delivery Order','Pesanan Penghantaran'))+' '+esc(d.no||'')+'</h1><span class="chip'+(d.status==='delivered'?' ok':'')+'">'+esc(st(d.status))+'</span></div>';
    h+='<div class="kv"><div><span>'+esc(L('Date','Tarikh'))+'</span><b>'+esc(dt(d.date))+'</b></div><div><span>'+esc(L('Customer','Pelanggan'))+'</span><b>'+esc(d.customer||'-')+'</b></div>'+
      (d.invoice?'<div><span>'+esc(L('Invoice','Invois'))+'</span><b>'+esc(d.invoice)+'</b></div>':'')+(d.driver?'<div><span>'+esc(L('Driver','Pemandu'))+'</span><b>'+esc(d.driver)+(d.vehicle?' · '+esc(d.vehicle):'')+'</b></div>':'')+'</div>';
    if(d.address) h+='<div class="lb">'+esc(L('Deliver to','Hantar ke'))+'</div><div class="sub" style="white-space:pre-line;color:var(--psd-text)">'+esc(d.address)+'</div>';
    h+='<div class="lb">'+esc(L('Items','Item'))+'</div><div class="items">'+(items.length?items.map(function(i){return '<div class="it"><span>'+esc(i.d||'-')+'</span><b>× '+esc(i.q==null?'-':i.q)+'</b></div>'}).join(''):'<div class="it"><span class="sub">'+esc(L('No item list on this delivery order.','Tiada senarai item pada pesanan ini.'))+'</span></div>')+'</div>';
    if(d.notes) h+='<div class="lb">'+esc(L('Notes','Nota'))+'</div><div class="sub" style="white-space:pre-wrap">'+esc(d.notes)+'</div>';
    if(sigs.length){
      var n=sigs.filter(function(x){return x.signed_at}).length;
      h+='<div class="lb">'+esc(L('Signatures','Tandatangan'))+' · '+n+'/'+sigs.length+'</div><div class="sigs">'+sigs.map(function(x){var ok=!!x.signed_at;
        return '<div class="sg"><div><b>'+esc(slotLbl(x))+'</b><small>'+esc(ok?(x.signer_name||'-')+' · '+dt(x.signed_at,1):L('Not signed yet','Belum ditandatangani'))+'</small></div><span class="chip '+(ok?'ok':'wait')+'">'+esc(ok?L('Signed','Ditandatangani'):L('Pending','Menunggu'))+'</span></div>'}).join('')+'</div>';
    }
    h+='<div class="box" id="dkp-box">';
    if(mine){
      var who=me&&me.signer_name?me.signer_name:(d.received_by||'-'), at=me&&me.signed_at?me.signed_at:d.received_at;
      h+='<div class="ok">✓ '+esc(L('Signed','Ditandatangani')+' · '+lbl)+'</div><div class="sub">'+esc(who+' · '+dt(at,1))+'</div><div class="sub">'+esc(L('Thank you. You can close this page.','Terima kasih. Anda boleh tutup halaman ini.'))+'</div>';
    } else if(d.status==='cancelled') h+='<div class="sub">'+esc(L('This delivery order was cancelled.','Pesanan penghantaran ini telah dibatalkan.'))+'</div>';
    else {
      h+='<b>'+esc(slot==='received'?L('Confirm you received the goods','Sahkan anda telah menerima barang'):L('Sign as ','Tandatangan sebagai ')+lbl)+'</b>'+
        '<div class="sub">'+esc(slot==='received'?L('Check the items above, then type your name and sign below.','Semak item di atas, kemudian taip nama dan tandatangan di bawah.'):L('Check the delivery order above, then type your name and sign below.','Semak pesanan di atas, kemudian taip nama dan tandatangan di bawah.'))+'</div>'+
        '<label for="dkp-n">'+esc(L('Your name','Nama anda'))+'</label><input id="dkp-n" maxlength="120" autocomplete="name">';
      if(canPad) h+='<label>'+esc(L('Your signature','Tandatangan anda'))+'</label><canvas id="dkp-pad" class="pad" aria-label="'+esc(L('Signature pad','Pad tandatangan'))+'"></canvas>'+
        '<div class="padrow"><span>'+esc(L('Sign with your finger.','Tandatangan dengan jari.'))+'</span><button type="button" class="lnk" id="dkp-clr">'+esc(L('Clear','Padam'))+'</button></div>';
      h+='<label for="dkp-t">'+esc(L('Note (optional)','Nota (pilihan)'))+'</label><textarea id="dkp-t" maxlength="500" placeholder="'+esc(L('e.g. 1 box damaged','cth. 1 kotak rosak'))+'"></textarea>'+
        '<div class="err" id="dkp-e" role="alert"></div><button class="btn" id="dkp-b" type="button">'+esc(slot==='received'?L('Sign & confirm received','Tandatangan & sahkan diterima'):L('Sign','Tandatangan'))+'</button>';
    }
    h+='</div><div class="foot">'+esc(L('Shared securely by ','Dikongsi dengan selamat oleh ')+(c.name||'M-Core'))+'</div></div>';
    root.innerHTML=h;
    var b=document.getElementById('dkp-b'); if(!b) return;
    var cv=document.getElementById('dkp-pad'); if(cv) initPad(cv);
    var clr=document.getElementById('dkp-clr'); if(clr) clr.onclick=clearPad;
    var bl=b.textContent;
    b.onclick=function(){
      var n=document.getElementById('dkp-n').value.trim(), t=document.getElementById('dkp-t').value.trim(), e=document.getElementById('dkp-e');
      var fail=function(m){e.textContent=m;e.style.display='block';b.disabled=false;b.textContent=bl};
      e.style.display='none';
      if(n.length<2) return fail(L('Please type your name.','Sila taip nama anda.'));
      if(canPad&&(!pad||!pad.ink)) return fail(L('Please draw your signature.','Sila lukis tandatangan anda.'));
      b.disabled=true;b.textContent=L('Saving…','Menyimpan…');
      var path=canPad?r.tid+'/do-sign/'+r.hash+'/'+slot+'-'+Date.now()+'.png':null;
      var upP=canPad?padBlob().then(function(blob){if(!blob)throw new Error('blob');return sb.storage.from('doc-files').upload(path,blob,{contentType:'image/png',upsert:false})}).then(function(u){if(u&&u.error)throw u.error}):Promise.resolve();
      upP.then(function(){
        if(mode==='sign') return sb.rpc('public_do_sign',{p_token:tok,p_name:n,p_path:path,p_note:t||null});
        return sb.rpc('public_do_confirm',canPad?{p_token:tok,p_name:n,p_note:t||null,p_path:path}:{p_token:tok,p_name:n,p_note:t||null});
      },function(){throw {upload:true}}).then(function(x){
        var r2=x.data||{};
        if(x.error||!r2.ok){var k=(r2&&r2.error)||'';return fail(k==='rate'?L('Too many attempts. Please try again later.','Terlalu banyak cubaan. Sila cuba sebentar lagi.'):k==='name'?L('Please type your name.','Sila taip nama anda.'):k==='signature'?L('Please draw your signature.','Sila lukis tandatangan anda.'):L('Could not save. Please try again.','Tidak dapat disimpan. Sila cuba lagi.'))}
        var at=r2.signed_at||r2.received_at||new Date().toISOString(), nm=r2.signer_name||r2.received_by||n;
        if(me){me.signed_at=at;me.signer_name=nm}
        if(slot==='received'){d.received_at=d.received_at||at;d.received_by=d.received_by||nm}
        render(r);
      }).catch(function(err){fail(err&&err.upload?L('Could not upload the signature. Please try again.','Tandatangan tidak dapat dimuat naik. Sila cuba lagi.'):L('Network error. Please try again.','Ralat rangkaian. Sila cuba lagi.'))});
    };
  }
  sb.rpc(mode==='sign'?'get_public_do_sign':'get_public_do',{p_token:tok}).then(function(x){
    if(x.error||!x.data||!x.data.ok){msg(L('This link is invalid or has expired.','Pautan ini tidak sah atau telah tamat tempoh.'));return}
    render(x.data);
  },function(){msg(L('Network error. Please refresh.','Ralat rangkaian. Sila muat semula.'))});
})();
</script>
